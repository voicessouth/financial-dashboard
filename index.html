<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voices South Financial Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        let db, auth, appId;
        let currentIncome = {};
        let expenses = [];
        let activeWeekKey = '';
        let unsubscribeIncome = null;
        let unsubscribeExpenses = null;

        const incomeCats = ['Cash/Checks', 'Credit Card', 'Text', 'Givelify', 'Tithely', 'CashApp', 'Zelle', 'Website Giving'];
        const expenseCats = ['Lady Val Payroll', 'Mortgage - Kirkland Group', 'Georgia Power', 'Georgia Natural Gas', 'Spectrum', 'Water Authority', 'Pest Control', 'Payroll Taxes', 'Band Payroll', 'Love Offerings', 'Ministry Design', 'Other'];

        // Anchor: Friday, Jan 2, 2026
        const ANCHOR_DATE = new Date(2026, 0, 2); 

        function updateStatus(text, colorClass, showRetry = false) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusText');
            const retryBtn = document.getElementById('retryBtn');
            if (dot && label) {
                dot.className = `w-2 h-2 rounded-full ${colorClass}`;
                label.innerText = text;
            }
            if (retryBtn) retryBtn.style.display = showRetry ? 'block' : 'none';
        }

        function generateWeeks() {
            const select = document.getElementById('weekSelector');
            select.innerHTML = '';
            
            // Current actual date
            const now = new Date();
            let current = new Date(ANCHOR_DATE);
            const weeks = [];

            // Generate weeks from anchor until 2 weeks in the future from today
            const limit = new Date();
            limit.setDate(limit.getDate() + 14);

            while (current <= limit) {
                const month = current.getMonth() + 1;
                const day = current.getDate();
                const year = current.getFullYear();
                const key = `${month}-${day}-${year}`;
                weeks.unshift(key); // Newest at top
                current.setDate(current.getDate() + 7);
            }

            weeks.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = `Week of ${key}`;
                select.appendChild(opt);
            });

            activeWeekKey = weeks[0];
            return weeks[0];
        }

        async function init() {
            // 1. Immediately render the UI and Weeks so user isn't stuck
            renderStaticUI();
            const initialWeek = generateWeeks();
            updateStatus("Connecting...", "bg-amber-400 animate-pulse");

            try {
                // Check if we are in the Preview environment with auto-config
                if (typeof __firebase_config === 'undefined') {
                    throw new Error("Missing Firebase Config - Check Vercel environment variables.");
                }

                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        updateStatus("Synced & Active", "bg-emerald-500");
                        loadWeekData(activeWeekKey || initialWeek);
                    } else {
                        updateStatus("Auth Required", "bg-rose-500", true);
                    }
                });

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

            } catch (err) {
                console.error("Init Error:", err);
                updateStatus("Offline Mode", "bg-slate-400", true);
                // Even in offline mode, allow interaction (though it won't save)
                calculateTotals();
            }
        }

        async function loadWeekData(weekKey) {
            if (!db || !auth.currentUser) return;
            
            if (unsubscribeIncome) unsubscribeIncome();
            if (unsubscribeExpenses) unsubscribeExpenses();

            activeWeekKey = weekKey;
            
            const incomeDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'income_summaries', weekKey);
            
            unsubscribeIncome = onSnapshot(incomeDocRef, (docSnap) => {
                currentIncome = docSnap.exists() ? docSnap.data().income : {};
                syncIncomeInputs();
                calculateTotals();
            }, (err) => console.log("Income Sync Wait..."));

            const expensesColRef = collection(db, 'artifacts', appId, 'public', 'data', `expenses_${weekKey}`);
            unsubscribeExpenses = onSnapshot(expensesColRef, (colSnap) => {
                expenses = colSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderExpenseList();
                calculateTotals();
            }, (err) => console.log("Expense Sync Wait..."));
        }

        function renderStaticUI() {
            const incContainer = document.getElementById('incomeFields');
            incContainer.innerHTML = incomeCats.map(cat => `
                <div class="flex justify-between items-center py-4 border-b border-slate-50 last:border-0">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${cat}</label>
                    <div class="flex items-center gap-2">
                        <span class="text-slate-300 font-bold">$</span>
                        <input type="number" step="0.01" data-cat="${cat}" onchange="handleIncomeChange('${cat}', this.value)" 
                        placeholder="0.00" class="income-input w-32 text-right font-black text-slate-800 outline-none bg-slate-50 focus:bg-indigo-50 focus:ring-2 ring-indigo-500/10 rounded-xl p-2 transition-all">
                    </div>
                </div>
            `).join('');

            const expSelect = document.getElementById('expenseCategory');
            expSelect.innerHTML = `<option value="" disabled selected>Select Category</option>` + 
                expenseCats.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        window.changeWeek = (val) => {
            loadWeekData(val);
        };

        window.handleIncomeChange = async (cat, val) => {
            const amount = parseFloat(val) || 0;
            currentIncome[cat] = amount;
            calculateTotals();
            
            if (!db || !auth.currentUser) return;
            const incomeDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'income_summaries', activeWeekKey);
            await setDoc(incomeDocRef, { 
                income: currentIncome, 
                lastUpdated: new Date().toISOString() 
            }, { merge: true });
        };

        window.addExpense = async () => {
            const cat = document.getElementById('expenseCategory').value;
            const amtInput = document.getElementById('expenseAmount');
            const amt = parseFloat(amtInput.value) || 0;

            if (!cat || amt <= 0) return;

            const newExp = { id: Date.now().toString(), category: cat, amount: amt, timestamp: new Date().toISOString() };
            expenses.push(newExp);
            renderExpenseList();
            calculateTotals();

            if (db && auth.currentUser) {
                const expenseDocRef = doc(db, 'artifacts', appId, 'public', 'data', `expenses_${activeWeekKey}`, newExp.id);
                await setDoc(expenseDocRef, newExp);
            }
            
            amtInput.value = '';
        };

        window.removeExpense = async (id) => {
            expenses = expenses.filter(e => e.id !== id);
            renderExpenseList();
            calculateTotals();

            if (db && auth.currentUser) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', `expenses_${activeWeekKey}`, id);
                await deleteDoc(docRef);
            }
        };

        function syncIncomeInputs() {
            document.querySelectorAll('.income-input').forEach(input => {
                const cat = input.dataset.cat;
                if (document.activeElement !== input) {
                    input.value = currentIncome[cat] || '';
                }
            });
        }

        function renderExpenseList() {
            const list = document.getElementById('expenseList');
            if (expenses.length === 0) {
                list.innerHTML = `<div class="py-12 text-center text-[10px] font-black text-slate-300 uppercase tracking-widest">No Disbursements</div>`;
                return;
            }
            list.innerHTML = expenses.map(exp => `
                <div class="flex justify-between items-center p-4 bg-white border border-slate-100 rounded-2xl">
                    <div>
                        <p class="text-[11px] font-black text-slate-800 uppercase mb-1">${exp.category}</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">${new Date(exp.timestamp).toLocaleDateString()}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-black text-rose-500 text-sm">-$${exp.amount.toFixed(2)}</span>
                        <button onclick="removeExpense('${exp.id}')" class="text-slate-200 hover:text-rose-600">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function calculateTotals() {
            const totalInc = Object.values(currentIncome).reduce((a, b) => a + b, 0);
            const totalExp = expenses.reduce((a, b) => a + b.amount, 0);
            const net = totalInc - totalExp;

            document.getElementById('totalInc').innerText = `$${totalInc.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('totalExp').innerText = `$${totalExp.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('netCash').innerText = `$${net.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        }

        window.onload = init;
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-[#fcfdfe] text-slate-900 min-h-screen pb-24">

    <header class="bg-white/90 backdrop-blur-xl border-b border-slate-100 sticky top-0 z-50 px-6 py-5 no-print">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-5">
                <div class="bg-indigo-600 p-3 rounded-2xl text-white shadow-lg shadow-indigo-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight text-slate-900 leading-none mb-1">Voices South Portal</h1>
                    <select id="weekSelector" onchange="changeWeek(this.value)" class="bg-transparent text-[10px] font-black text-indigo-600 uppercase tracking-widest outline-none border-none p-0 cursor-pointer">
                        <option>Loading weeks...</option>
                    </select>
                </div>
            </div>
            
            <div class="flex flex-col items-end gap-1">
                <div class="flex items-center gap-3 px-4 py-2 bg-slate-50 border border-slate-100 rounded-full">
                    <div id="statusDot" class="w-2 h-2 bg-slate-300 rounded-full"></div>
                    <span id="statusText" class="text-[9px] font-black text-slate-500 uppercase tracking-widest text-right">Initializing...</span>
                </div>
                <button id="retryBtn" onclick="location.reload()" class="hidden text-[9px] font-black text-indigo-600 uppercase underline">Refresh Page</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-12 space-y-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Total Receipts</p>
                <p id="totalInc" class="text-4xl font-black text-emerald-600 tracking-tighter">$0.00</p>
            </div>
            <div class="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Total Expenses</p>
                <p id="totalExp" class="text-4xl font-black text-slate-900 tracking-tighter">$0.00</p>
            </div>
            <div class="bg-indigo-600 p-10 rounded-[3rem] shadow-2xl shadow-indigo-100 text-white">
                <p class="text-[10px] font-black text-indigo-200 uppercase tracking-widest mb-3">Net Cash</p>
                <p id="netCash" class="text-4xl font-black tracking-tighter">$0.00</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <section class="lg:col-span-5 bg-white p-10 rounded-[3.5rem] border border-slate-100 shadow-sm">
                <div class="flex items-center gap-4 mb-10">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <h2 class="text-xs font-black text-slate-900 uppercase tracking-widest">Revenue Entry</h2>
                </div>
                <div id="incomeFields" class="space-y-1"></div>
            </section>

            <section class="lg:col-span-7 space-y-12">
                <div class="bg-slate-900 p-12 rounded-[3.5rem] text-white shadow-2xl">
                    <h2 class="text-xs font-black uppercase tracking-[0.2em] mb-10 text-slate-500">Log Disbursement</h2>
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                        <div class="md:col-span-6">
                            <select id="expenseCategory" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-xs font-black text-white outline-none focus:ring-2 ring-indigo-500/50 appearance-none">
                            </select>
                        </div>
                        <div class="md:col-span-4">
                            <input type="number" id="expenseAmount" placeholder="0.00" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-xs font-black outline-none focus:ring-2 ring-indigo-500/50 text-white">
                        </div>
                        <div class="md:col-span-2">
                            <button onclick="addExpense()" class="w-full h-full bg-indigo-500 hover:bg-indigo-400 text-white rounded-2xl transition-all active:scale-95 flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-12 rounded-[3.5rem] border border-slate-100 shadow-sm">
                    <h2 class="text-xs font-black text-slate-900 uppercase tracking-widest mb-10">Disbursement Ledger</h2>
                    <div id="expenseList" class="space-y-4"></div>
                </div>
            </section>
        </div>
    </main>

    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 w-full max-w-sm px-6 no-print">
        <button onclick="window.print()" class="w-full bg-slate-900 hover:bg-black text-white py-6 rounded-[2.5rem] font-black text-[11px] uppercase tracking-[0.3em] shadow-2xl flex items-center justify-center gap-4">
            Print Statement
        </button>
    </div>

</body>
</html>
