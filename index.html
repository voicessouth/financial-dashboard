<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Financial Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #64748b;
            --accent: #4f46e5;
        }
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            padding-left: 0.25rem;
        }
        .input-style {
            width: 100%;
            padding: 1rem;
            background-color: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 16px;
            font-weight: 600;
            color: #1e293b;
            transition: all 0.2s;
        }
        .input-style:focus {
            outline: none;
            background-color: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1);
        }
        .btn-submit {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            width: 100%;
            padding: 1.25rem;
            border-radius: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
            transition: all 0.2s;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        .hidden { display: none; }
        .animate-in { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-4 md:p-10 flex flex-col items-center min-h-screen">

    <div class="w-full max-w-xl space-y-8">
        <!-- Brand Header -->
        <header class="flex items-center justify-between px-2">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-2xl shadow-lg shadow-blue-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-800 tracking-tight">Finance Portal</h1>
                    <p id="connectionStatus" class="text-[10px] font-bold text-amber-500 uppercase tracking-widest flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse"></span> Offline Mode
                    </p>
                </div>
            </div>
            <div id="dateDisplay" class="text-right">
                <p class="text-xs font-black text-slate-400 uppercase">System Date</p>
                <p class="text-sm font-bold text-slate-700">Loading...</p>
            </div>
        </header>

        <!-- Main Entry Card -->
        <div class="glass-card p-8">
            <form id="expenseForm" class="space-y-6">
                
                <div class="input-group">
                    <label>Select Category</label>
                    <select id="category" required class="input-style" onchange="handleCategoryChange()">
                        <option value="">Choose Category...</option>
                        <optgroup label="Payroll & Personnel">
                            <option value="Pastor Payroll">Pastor Payroll</option>
                            <option value="Lady Val Payroll">Lady Val Payroll</option>
                            <option value="Band Payroll">Band Payroll</option>
                        </optgroup>
                        <optgroup label="Fixed Costs & Banking">
                            <option value="Mortgage">Mortgage</option>
                            <option value="First Citizens Bank">First Citizens Bank</option>
                            <option value="Kaiser Permanente">Kaiser Permanente</option>
                        </optgroup>
                        <optgroup label="Utilities & Services">
                            <option value="Georgia Power">Georgia Power</option>
                            <option value="Water Authority">Water Authority</option>
                            <option value="T-Mobile">T-Mobile</option>
                            <option value="Spectrum">Spectrum</option>
                        </optgroup>
                        <optgroup label="Other Operations">
                            <option value="Guest Speakers">Guest Speakers</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Supplies">Supplies</option>
                            <option value="Other">Other</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Conditional Information Box -->
                <div id="infoWrapper" class="hidden animate-in">
                    <div class="input-group">
                        <label id="infoLabel">Additional Information</label>
                        <input type="text" id="infoDetail" placeholder="Enter details..." class="input-style">
                    </div>
                </div>

                <div class="input-group">
                    <label>Transaction Amount ($)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-slate-400">$</span>
                        <input type="number" id="amount" step="0.01" required placeholder="0.00" class="input-style pl-8">
                    </div>
                </div>

                <div class="input-group">
                    <label>Transaction Date</label>
                    <input type="date" id="txnDate" required class="input-style">
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    Record Expense
                </button>
            </form>
        </div>

        <!-- Feedback UI -->
        <div id="successMsg" class="hidden bg-emerald-500 text-white p-4 rounded-2xl text-center font-bold text-sm animate-in shadow-lg">
            ✓ Entry successfully synced to cloud
        </div>

        <!-- Recent Entries Log -->
        <section class="space-y-4">
            <div class="flex items-center justify-between px-2">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">Recent Activity</h2>
                <button onclick="clearLocalLogs()" class="text-[10px] font-bold text-slate-300 hover:text-rose-400 uppercase">Clear View</button>
            </div>
            
            <div id="logContainer" class="space-y-3 pb-20">
                <!-- Log Items injected here -->
                <div class="text-center py-10 opacity-30">
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-widest">No entries recorded today</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Firebase Integration Logic -->
    <script>
        // REPLACE WITH YOUR ACTUAL CONFIG FROM PREVIOUS VERSION IF AVAILABLE
        const firebaseConfig = {
            apiKey: "AIzaSyDb6oFZEStklFT_Dt2riDbQC_IJPHcT304",
            authDomain: "church-finance-dashboard-40dca.firebaseapp.com",
            projectId: "church-finance-dashboard-40dca",
            storageBucket: "church-finance-dashboard-40dca.firebasestorage.app",
            messagingSenderId: "480863076081",
            appId: "1:480863076081:web:dd01f7270a7cd158f93350"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "church-finance-dashboard-40dca";

        // State Management
        let isConnected = false;

        // Initialize App
        window.onload = () => {
            document.getElementById('txnDate').valueAsDate = new Date();
            updateHeaderDate();
            
            auth.signInAnonymously().then(() => {
                isConnected = true;
                const status = document.getElementById('connectionStatus');
                status.innerHTML = '<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> Live Cloud Sync';
                status.className = "text-[10px] font-bold text-emerald-600 uppercase tracking-widest flex items-center gap-1";
                loadRecentEntries();
            }).catch(err => {
                console.error("Auth error:", err);
            });
        };

        function updateHeaderDate() {
            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            document.querySelector('#dateDisplay p:last-child').innerText = new Date().toLocaleDateString('en-US', options);
        }

        function handleCategoryChange() {
            const cat = document.getElementById('category').value;
            const wrapper = document.getElementById('infoWrapper');
            const label = document.getElementById('infoLabel');
            const input = document.getElementById('infoDetail');

            if (cat === 'Guest Speakers' || cat === 'Other') {
                wrapper.classList.remove('hidden');
                input.required = true;
                label.innerText = cat === 'Guest Speakers' ? "Speaker's Name" : "Specify Expense";
                input.placeholder = cat === 'Guest Speakers' ? "e.g. Pastor John Doe" : "e.g. Office Chairs";
            } else {
                wrapper.classList.add('hidden');
                input.required = false;
                input.value = "";
            }
        }

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            
            btn.innerText = "Syncing...";
            btn.disabled = true;

            const entry = {
                category: document.getElementById('category').value,
                amount: parseFloat(document.getElementById('amount').value),
                date: document.getElementById('txnDate').value,
                info: document.getElementById('infoDetail').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // Determine target week for storage
                const d = new Date(entry.date);
                const weekKey = `${d.getMonth() + 1}-${d.getDate()}-${d.getFullYear()}`;
                
                await db.collection('artifacts').doc(appId).collection('public').doc('data')
                        .collection('finance_entries').doc(weekKey).collection('expenses').add(entry);

                showSuccess();
                addToLocalLog(entry);
                e.target.reset();
                handleCategoryChange();
                document.getElementById('txnDate').valueAsDate = new Date();
            } catch (err) {
                alert("Storage error: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        function showSuccess() {
            const msg = document.getElementById('successMsg');
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
        }

        function addToLocalLog(entry) {
            const container = document.getElementById('logContainer');
            if (container.querySelector('.opacity-30')) container.innerHTML = '';

            const div = document.createElement('div');
            div.className = "glass-card p-5 flex justify-between items-center animate-in";
            
            const detailHtml = entry.info ? `<p class="text-[10px] font-bold text-blue-500 mt-1">Note: ${entry.info}</p>` : '';
            
            div.innerHTML = `
                <div class="flex flex-col">
                    <span class="text-sm font-black text-slate-700">${entry.category}</span>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${entry.date}</span>
                    ${detailHtml}
                </div>
                <div class="text-right">
                    <span class="text-lg font-black text-rose-500">-$${entry.amount.toFixed(2)}</span>
                </div>
            `;
            container.prepend(div);
        }

        function clearLocalLogs() {
            document.getElementById('logContainer').innerHTML = `
                <div class="text-center py-10 opacity-30">
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-widest">History cleared from view</p>
                </div>
            `;
        }

        // Mock loader for "Recent Activity" UI feel
        async function loadRecentEntries() {
            // In a production app, you'd fetch the last 5 entries from Firestore here.
        }
    </script>
</body>
</html>
