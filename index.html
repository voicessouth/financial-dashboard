<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voices South - Weekly Income and Payables</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --emerald: #10b981;
            --rose: #f43f5e;
        }
        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="text-slate-900 min-h-screen pb-24">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 p-3 rounded-2xl text-white shadow-lg shadow-indigo-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight text-slate-900 leading-none">Voices South Portal</h1>
                    <div class="flex items-center gap-2 mt-1.5">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Reporting Period:</span>
                        <select id="weekSelector" onchange="changeWeek(this.value)" class="bg-transparent text-[10px] font-black text-indigo-600 uppercase tracking-widest outline-none border-none p-0 cursor-pointer focus:ring-0">
                            <option>Loading weeks...</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2.5 px-4 py-2 bg-slate-50 border border-slate-100 rounded-2xl">
                    <div id="statusDot" class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></div>
                    <span id="statusText" class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Connecting...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-10 space-y-10">
        
        <!-- Summary Tiles matching Sheet Totals structure -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Weekly Receipts</p>
                <p id="totalIncDisplay" class="text-3xl font-black text-emerald-600">$0.00</p>
            </div>
            <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Weekly Payables</p>
                <p id="totalExpDisplay" class="text-3xl font-black text-slate-900">$0.00</p>
            </div>
            <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Net Flow Balance</p>
                <p id="netCashDisplay" class="text-3xl font-black text-indigo-600">$0.00</p>
            </div>
            <div class="bg-indigo-600 p-6 rounded-[2rem] shadow-xl shadow-indigo-100 text-white">
                <p class="text-[10px] font-black text-indigo-200 uppercase tracking-widest mb-1">Bank Statement Balance</p>
                <div class="flex items-center gap-1 mt-1">
                    <span class="text-lg font-bold">$</span>
                    <input type="number" step="0.01" id="bankBalanceInput" onchange="saveBankBalance(this.value)" placeholder="0.00" class="bg-transparent text-2xl font-black text-white outline-none border-b border-white/20 focus:border-white w-full">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Revenue Entry Form -->
            <section class="lg:col-span-5 bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-xs font-black text-slate-900 uppercase tracking-widest">Revenue Entry Channels</h2>
                        <p class="text-[10px] font-semibold text-slate-400 mt-0.5">Categorized per day/source</p>
                    </div>
                    <div class="bg-slate-50 px-3 py-1 border border-slate-100 rounded-xl flex items-center gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Day:</label>
                        <select id="revenueDay" onchange="refreshRevenueFields()" class="bg-transparent text-[10px] font-black text-indigo-600 outline-none cursor-pointer">
                            <option value="Sunday">Sunday (Sun)</option>
                            <option value="Tuesday">Tuesday (Tue)</option>
                            <option value="End of Week">End of Week</option>
                            <option value="End of Month">End of Month</option>
                        </select>
                    </div>
                </div>
                
                <div id="incomeFields" class="space-y-1">
                    <!-- Fields dynamically loaded -->
                </div>
            </section>

            <!-- Payables / Expenses Column -->
            <section class="lg:col-span-7 space-y-10">
                <!-- Entry Form -->
                <div class="bg-slate-900 p-8 md:p-10 rounded-[2.5rem] text-white shadow-2xl">
                    <h2 class="text-xs font-black uppercase tracking-widest mb-6 text-slate-400">Log Payable Entry</h2>
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                        <div class="md:col-span-5">
                            <select id="expenseCategory" onchange="handleCategoryChange()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-xs font-bold text-white outline-none focus:ring-2 ring-indigo-500/50 cursor-pointer">
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                        <div class="md:col-span-4">
                            <input type="number" id="expenseAmount" placeholder="0.00" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-xs font-bold outline-none focus:ring-2 ring-indigo-500/50 text-white">
                        </div>
                        <div class="md:col-span-3">
                            <select id="expenseDay" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-xs font-bold text-white outline-none focus:ring-2 ring-indigo-500/50 cursor-pointer">
                                <option value="Sun" class="text-slate-800">Sun</option>
                                <option value="Tue" class="text-slate-800">Tue</option>
                                <option value="End of Week" class="text-slate-800">End of Week</option>
                                <option value="End of Month" class="text-slate-800">End of Month</option>
                            </select>
                        </div>
                    </div>

                    <!-- Dynamic Details Input (Conditional) -->
                    <div id="additionalDetailsWrapper" class="mt-4 hidden">
                        <input type="text" id="expenseDetail" placeholder="Enter Speaker Name, Specific Item, or Special Event notes" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-xs font-semibold outline-none focus:ring-2 ring-indigo-500/50 text-white placeholder-slate-500">
                    </div>

                    <button onclick="addExpense()" class="mt-6 w-full py-4 bg-indigo-500 hover:bg-indigo-400 text-white rounded-xl font-black text-xs uppercase tracking-widest transition-all active:scale-95 shadow-lg shadow-indigo-500/10">
                        Record Payable Entry
                    </button>
                </div>

                <!-- Ledger list representation matching sheets -->
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">Payable Statement</h2>
                        <span class="text-[9px] font-bold text-slate-300 uppercase tracking-wider">Current Period Log</span>
                    </div>
                    <div id="expenseList" class="space-y-3 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                        <!-- Ledger cards loaded here -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer Summary report generation -->
    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-sm px-6 no-print">
        <button onclick="window.print()" class="w-full bg-slate-900 hover:bg-black text-white py-4 rounded-2xl font-black text-[10px] uppercase tracking-[0.25em] shadow-2xl transition-all active:scale-95 flex items-center justify-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Print Summary Ledger
        </button>
    </div>

    <!-- Application Script Engine -->
    <script type="module">
        // Firebase initialization configuration block
        const firebaseConfig = {
            apiKey: "AIzaSyDb6oFZEStklFT_Dt2riDbQC_IJPHcT304",
            authDomain: "church-finance-dashboard-40dca.firebaseapp.com",
            projectId: "church-finance-dashboard-40dca",
            storageBucket: "church-finance-dashboard-40dca.firebasestorage.app",
            messagingSenderId: "480863076081",
            appId: "1:480863076081:web:dd01f7270a7cd158f93350"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "church-finance-dashboard-40dca";

        // Category configurations matching exact sheet values
        const incomeCats = [
            'Cash/Checks', 
            'Credit/Debit cards', 
            'Text', 
            'Givelify', 
            'Tithely', 
            'CashApp', 
            'Zelle', 
            'Website giving'
        ];

        const expenseCats = [
            'Lady Val Payroll',
            'Pastor Payroll',
            'Mortgage - Kirkland Group',
            'Admin Payroll Taxes and fees',
            'Band Payroll',
            'Pastor Love offerings',
            'Georgia Power',
            'Georgia Natural Gas',
            'Spectrum (TV, Phone, Internet)',
            'Henry County Water Authority',
            'TMobile',
            'Kaiser Permanente',
            'GFL Environmental',
            'Ministry Design',
            'Quickbooks',
            'Team Pest USA',
            'First Citizens Bank',
            'Guest Speakers',
            'Other'
        ];

        // Anchor Timeline configuration: Every Friday starting from Jan 2, 2026
        const ANCHOR_DATE = new Date(2026, 0, 2); 
        let activeWeekKey = '';
        let incomeData = {}; // Structured by Day -> Category -> value
        let expensesData = [];
        let bankBalance = 0;

        function updateStatus(text, colorClass) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusText');
            if (dot && label) {
                dot.className = `w-2 h-2 rounded-full ${colorClass}`;
                label.innerText = text;
            }
        }

        // Build 12 weeks selector list starting from anchor
        function generateWeeks() {
            const select = document.getElementById('weekSelector');
            select.innerHTML = '';
            
            const limit = new Date();
            limit.setDate(limit.getDate() + 21); // Include upcoming periods

            let current = new Date(ANCHOR_DATE);
            const weeks = [];
            while (current <= limit) {
                const key = `${current.getMonth() + 1}-${current.getDate()}-${current.getFullYear()}`;
                weeks.unshift(key); // descending
                current.setDate(current.getDate() + 7);
            }

            weeks.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = `Week of ${key}`;
                select.appendChild(opt);
            });

            activeWeekKey = weeks[0];
            return weeks[0];
        }

        function initApp() {
            renderStaticSelectors();
            const initialWeek = generateWeeks();
            updateStatus("Connecting...", "bg-amber-400 animate-pulse");

            auth.signInAnonymously().then(() => {
                updateStatus("Synced & Active", "bg-emerald-500");
                loadWeekData(activeWeekKey || initialWeek);
            }).catch(err => {
                console.error("Auth Handshake Failed:", err);
                updateStatus("Offline Session", "bg-slate-400");
                loadWeekData(activeWeekKey || initialWeek); // local/fallback engagement
            });
        }

        let unsubscribeIncome = null;
        let unsubscribeExpenses = null;

        function loadWeekData(weekKey) {
            activeWeekKey = weekKey;
            
            if (unsubscribeIncome) unsubscribeIncome();
            if (unsubscribeExpenses) unsubscribeExpenses();

            // Strict compliance path for church records: artifacts/{appId}/public/data/...
            const incomeDocRef = db.collection('artifacts').doc(appId).collection('public').doc('data')
                                  .collection('income_summaries').doc(weekKey);
            const expensesColRef = db.collection('artifacts').doc(appId).collection('public').doc('data')
                                    .collection('weekly_payables').doc(weekKey).collection('expenses');

            // Listen for Income Summaries
            unsubscribeIncome = incomeDocRef.onSnapshot((docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    incomeData = data.income || {};
                    bankBalance = data.bankBalance || 0;
                } else {
                    incomeData = {};
                    bankBalance = 0;
                }
                syncInputsToState();
                calculateAndRefreshUI();
            });

            // Listen for Expenses Log
            unsubscribeExpenses = expensesColRef.onSnapshot((colSnap) => {
                expensesData = colSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderExpenseLedger();
                calculateAndRefreshUI();
            });
        }

        function renderStaticSelectors() {
            const expSelect = document.getElementById('expenseCategory');
            expSelect.innerHTML = `<option value="" disabled selected>Choose Category</option>` +
                expenseCats.map(cat => `<option value="${cat}" class="text-slate-900">${cat}</option>`).join('');
            
            refreshRevenueFields();
        }

        window.refreshRevenueFields = () => {
            const currentDay = document.getElementById('revenueDay').value;
            const container = document.getElementById('incomeFields');
            
            container.innerHTML = incomeCats.map(cat => {
                const value = (incomeData[currentDay] && incomeData[currentDay][cat]) ? incomeData[currentDay][cat] : '';
                return `
                    <div class="flex justify-between items-center py-3.5 border-b border-slate-50 last:border-0">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${cat}</label>
                        <div class="flex items-center gap-1">
                            <span class="text-slate-300 font-bold">$</span>
                            <input type="number" step="0.01" data-cat="${cat}" value="${value}" onchange="saveIncomeValue('${cat}', this.value)" 
                            placeholder="0.00" class="income-input w-28 text-right font-black text-slate-800 outline-none bg-slate-50 focus:bg-indigo-50/50 rounded-xl p-1.5 transition-all">
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.saveIncomeValue = async (cat, val) => {
            const day = document.getElementById('revenueDay').value;
            const numeric = parseFloat(val) || 0;
            
            if (!incomeData[day]) incomeData[day] = {};
            incomeData[day][cat] = numeric;

            calculateAndRefreshUI();

            const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data')
                             .collection('income_summaries').doc(activeWeekKey);
            await docRef.set({ income: incomeData }, { merge: true });
        };

        window.saveBankBalance = async (val) => {
            bankBalance = parseFloat(val) || 0;
            calculateAndRefreshUI();

            const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data')
                             .collection('income_summaries').doc(activeWeekKey);
            await docRef.set({ bankBalance }, { merge: true });
        };

        window.handleCategoryChange = () => {
            const category = document.getElementById('expenseCategory').value;
            const wrapper = document.getElementById('additionalDetailsWrapper');
            const detailInput = document.getElementById('expenseDetail');

            if (category === 'Guest Speakers' || category === 'Other') {
                wrapper.classList.remove('hidden');
                detailInput.placeholder = category === 'Guest Speakers' ? "e.g., Will Rhodes (Guest Psalmist - Sunday)" : "e.g., Office printing checks, qty 50";
            } else {
                wrapper.classList.add('hidden');
                detailInput.value = '';
            }
        };

        window.addExpense = async () => {
            const cat = document.getElementById('expenseCategory').value;
            const amtInput = document.getElementById('expenseAmount');
            const amt = parseFloat(amtInput.value) || 0;
            const day = document.getElementById('expenseDay').value;
            const details = document.getElementById('expenseDetail').value.trim();

            if (!cat || amt <= 0) return;

            const id = Date.now().toString();
            const expenseItem = {
                id,
                category: cat,
                amount: amt,
                day,
                details: details || '',
                timestamp: new Date().toISOString()
            };

            const expensesColRef = db.collection('artifacts').doc(appId).collection('public').doc('data')
                                    .collection('weekly_payables').doc(activeWeekKey).collection('expenses');
            
            await expensesColRef.doc(id).set(expenseItem);

            // clear input form
            amtInput.value = '';
            document.getElementById('expenseCategory').value = '';
            document.getElementById('expenseDetail').value = '';
            document.getElementById('additionalDetailsWrapper').classList.add('hidden');
        };

        window.removeExpense = async (id) => {
            const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data')
                             .collection('weekly_payables').doc(activeWeekKey).collection('expenses').doc(id);
            await docRef.delete();
        };

        window.changeWeek = (weekKey) => {
            loadWeekData(weekKey);
        };

        function syncInputsToState() {
            document.getElementById('bankBalanceInput').value = bankBalance > 0 ? bankBalance : '';
            refreshRevenueFields();
        }

        function renderExpenseLedger() {
            const list = document.getElementById('expenseList');
            if (expensesData.length === 0) {
                list.innerHTML = `<div class="py-12 text-center text-[10px] font-black text-slate-300 uppercase tracking-widest">No Disbursements Record</div>`;
                return;
            }

            list.innerHTML = expensesData.map(exp => `
                <div class="flex justify-between items-center p-4 bg-slate-50 border border-slate-100 rounded-2xl">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] font-black text-slate-800 uppercase leading-none">${exp.category}</span>
                            <span class="text-[8px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-black uppercase tracking-tight">${exp.day}</span>
                        </div>
                        ${exp.details ? `<p class="text-[10px] font-semibold text-indigo-500 mt-1.5 leading-none">Note: ${exp.details}</p>` : ''}
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-black text-rose-500 text-sm">-$${exp.amount.toFixed(2)}</span>
                        <button onclick="removeExpense('${exp.id}')" class="text-slate-200 hover:text-rose-600 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function calculateAndRefreshUI() {
            // Calculate Total Income (reaches across all week days)
            let totalInc = 0;
            Object.keys(incomeData).forEach(day => {
                Object.values(incomeData[day] || {}).forEach(val => {
                    totalInc += (parseFloat(val) || 0);
                });
            });

            // Calculate Total Payables
            const totalExp = expensesData.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
            const netFlow = totalInc - totalExp;

            document.getElementById('totalIncDisplay').innerText = `$${totalInc.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('totalExpDisplay').innerText = `$${totalExp.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('netCashDisplay').innerText = `$${netFlow.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        }

        window.onload = initApp;
    </script>
</body>
</html>
