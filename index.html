<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voices South Financial Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; }
        .hidden { display: none !important; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .income-input {
            width: 100%;
            text-align: right;
            background: transparent;
            font-weight: 900;
            font-size: 1.1rem;
            outline: none;
            border: none;
            color: #0f172a;
            padding: 4px 0;
        }
        .locked-input {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .day-tab {
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .day-tab.active {
            background-color: #1e293b;
            color: white;
            border-color: #1e293b;
        }
        .day-tab:not(.active) {
            background-color: white;
            color: #64748b;
            border-color: #e2e8f0;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-[100]">
        <div class="w-full max-w-md bg-white rounded-[2.5rem] p-10 text-slate-900 shadow-2xl">
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-white mx-auto mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <h1 class="text-2xl font-black uppercase tracking-tighter text-slate-900">Voices South</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Financial Portal v3.3</p>
            </div>
            <div class="space-y-4">
                <input id="login-id" type="text" placeholder="Admin ID" class="w-full px-5 py-4 bg-slate-100 rounded-xl font-bold border-2 border-transparent focus:border-indigo-500 transition-all outline-none">
                <input id="login-pw" type="password" placeholder="Password" class="w-full px-5 py-4 bg-slate-100 rounded-xl font-bold border-2 border-transparent focus:border-indigo-500 transition-all outline-none">
                <button onclick="handleLogin()" id="login-btn" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase tracking-widest hover:bg-indigo-600 transition-all shadow-xl">Enter Dashboard</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-screen" class="hidden min-h-screen pb-48">
        <nav class="bg-white border-b p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm px-6">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white text-xs font-black">V</div>
                <span class="font-black text-xs uppercase tracking-tighter text-slate-900">Financial Dashboard</span>
            </div>
            <button onclick="location.reload()" class="text-[10px] font-black uppercase text-slate-400 hover:text-rose-500 transition-colors">Logout</button>
        </nav>

        <div class="max-w-5xl mx-auto p-6 space-y-6">
            <!-- Date Navigation -->
            <div class="bg-white p-8 rounded-[2.5rem] border shadow-sm text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-emerald-500"></div>
                <div class="flex items-center justify-between max-w-xs mx-auto mb-2">
                    <button onclick="changeDate(-7)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <div>
                        <h2 id="display-date" class="text-3xl font-black tracking-tighter italic text-slate-900">...</h2>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-[0.2em]">Week Ending Date</p>
                    </div>
                    <button onclick="changeDate(7)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>
                <div class="flex items-center justify-center gap-2">
                    <div id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span id="sync-status" class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Live Cloud Sync</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- REVENUE ENTRY -->
                <div class="bg-white p-7 rounded-[2.5rem] border shadow-sm flex flex-col">
                    <div class="flex justify-between items-start mb-6">
                        <h3 class="font-black text-[11px] uppercase tracking-[0.2em] text-slate-400 flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-200"></span> Weekly Income Entry
                        </h3>
                        <div id="legacy-alert" class="hidden animate-bounce">
                            <span class="bg-amber-100 text-amber-700 text-[9px] font-black px-3 py-1 rounded-full uppercase">Old Data Found</span>
                        </div>
                    </div>
                    
                    <!-- Day Selector Tabs -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-8">
                        <button onclick="setActiveDay('sun')" id="tab-sun" class="day-tab px-3 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest active">Sun</button>
                        <button onclick="setActiveDay('tue')" id="tab-tue" class="day-tab px-3 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Tue</button>
                        <button onclick="setActiveDay('eow')" id="tab-eow" class="day-tab px-3 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest leading-tight">End Week</button>
                        <button onclick="setActiveDay('eom')" id="tab-eom" class="day-tab px-3 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest leading-tight">End Month</button>
                    </div>

                    <div id="income-grid" class="space-y-4 flex-1">
                        <!-- Dynamic content via JS -->
                    </div>

                    <!-- Global Bank Balance -->
                    <div class="mt-8 pt-6 border-t border-slate-100">
                        <div class="flex justify-between items-center bg-indigo-50 p-5 rounded-3xl border border-indigo-100">
                            <div>
                                <span class="text-[10px] font-black uppercase text-indigo-500 block">Bank Balance</span>
                                <span class="text-[9px] text-indigo-300 uppercase font-bold">Closing Statement</span>
                            </div>
                            <div class="flex items-center w-32">
                                <span class="text-sm font-bold text-indigo-300 mr-1">$</span>
                                <input type="number" id="in-bank_balance" step="0.01" class="income-input text-indigo-700" onchange="updateRevenue('bank_balance', this.value)">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- EXPENSES -->
                <div class="space-y-6">
                    <div id="expense-entry-box" class="bg-white p-7 rounded-[2.5rem] border shadow-sm">
                        <h3 class="font-black text-[11px] uppercase tracking-[0.2em] text-slate-400 mb-6 flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full bg-rose-500 shadow-lg shadow-rose-200"></span> Log Expense
                        </h3>
                        <div class="space-y-3">
                            <select id="exp-cat" class="w-full p-4 bg-slate-50 rounded-2xl text-xs font-bold border-2 border-transparent focus:border-indigo-500 outline-none">
                                <option>Mortgage - Kirkland Group</option>
                                <option>Pastor Payroll</option>
                                <option>Lady Val Payroll</option>
                                <option>Admin Payroll Taxes</option>
                                <option>Band Payroll</option>
                                <option>Georgia Power</option>
                                <option>Georgia Natural Gas</option>
                                <option>Spectrum</option>
                                <option>Water Authority</option>
                                <option>TMobile</option>
                                <option>Ministry Design</option>
                                <option>Quickbooks</option>
                                <option>GFL Environmental</option>
                                <option>Other/Misc</option>
                            </select>
                            <div class="flex gap-2">
                                <input id="exp-amt" type="number" step="0.01" placeholder="Amount" class="flex-1 p-4 bg-slate-50 rounded-2xl font-bold text-lg border-2 border-transparent focus:border-indigo-500 outline-none">
                                <button onclick="addExpense()" id="add-exp-btn" class="bg-slate-900 text-white px-8 rounded-2xl font-black text-xl hover:bg-indigo-600 transition-all shadow-lg">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-7 rounded-[2.5rem] border shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-black text-[11px] uppercase tracking-[0.2em] text-slate-400">Weekly Log</h3>
                            <span id="exp-total-badge" class="text-[10px] font-black text-rose-500 bg-rose-50 px-3 py-1 rounded-full">$0.00 OUT</span>
                        </div>
                        <div id="expense-list" class="space-y-2 max-h-[300px] overflow-y-auto custom-scroll pr-2">
                            <!-- Transactions appear here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- FOOTER TOTALS -->
            <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-4xl bg-slate-900 p-8 rounded-[3rem] text-white flex flex-col md:flex-row justify-between items-center shadow-2xl gap-6 z-40">
                <div class="text-center md:text-left flex-1">
                    <p class="text-[10px] font-black uppercase text-slate-400 tracking-[0.3em] mb-1">Weekly Cash Flow (Net Sum)</p>
                    <p id="total-val" class="text-4xl font-black tracking-tighter italic text-emerald-400">$0.00</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right hidden md:block mr-4">
                        <p class="text-[9px] font-black uppercase text-slate-500 tracking-widest">Total Income</p>
                        <p id="total-revenue-sum" class="text-lg font-bold text-emerald-400">$0.00</p>
                    </div>
                    <button onclick="sealReport()" id="seal-btn" class="bg-white text-black px-10 py-4 rounded-[1.5rem] font-black uppercase text-xs tracking-widest hover:bg-emerald-500 hover:text-white transition-all">
                        Finalize Week
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDb6oFZEStklFT_Dt2riDbQC_IJPHcT304",
            authDomain: "church-finance-dashboard-40dca.firebaseapp.com",
            projectId: "church-finance-dashboard-40dca",
            storageBucket: "church-finance-dashboard-40dca.firebasestorage.app",
            messagingSenderId: "480863076081",
            appId: "1:480863076081:web:dd01f7270a7cd158f93350"
        };

        const INCOME_CATEGORIES = [
            'Cash/Checks', 
            'Credit/Debit cards', 
            'Text', 
            'Givelify', 
            'Tithely', 
            'CashApp', 
            'Zelle', 
            'Website giving'
        ];

        const appId = "church-finance-dashboard-40dca";
        let db, auth;
        
        // --- NEW LOGIC: START AT JAN 2nd 2026 ---
        let currentDate = new Date(2026, 0, 2); 
        
        let activeDay = 'sun';
        let currentData = { revenue: {}, expenses: [], status: 'open' };

        window.onload = async () => {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
                await auth.signInAnonymously();
                
                // If today is past Jan 2nd 2026, adjust the default date to the most recent Friday relative to today
                const realToday = new Date();
                if (realToday > currentDate) {
                    const diffInTime = realToday.getTime() - currentDate.getTime();
                    const diffInDays = Math.floor(diffInTime / (1000 * 3600 * 24));
                    const weeksToAdd = Math.floor(diffInDays / 7);
                    currentDate.setDate(currentDate.getDate() + (weeksToAdd * 7));
                }
            } catch (e) { console.error(e); }
        };

        function handleLogin() {
            if (document.getElementById('login-id').value === "voicessouth" && 
                document.getElementById('login-pw').value === "3894South") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                loadWeekData();
            } else { alert("Access Denied"); }
        }

        function changeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            loadWeekData();
        }

        function setActiveDay(day) {
            activeDay = day;
            document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + day).classList.add('active');
            updateUI();
        }

        let unsubscribe = null;
        function loadWeekData() {
            const dateStr = (currentDate.getMonth() + 1) + '-' + currentDate.getDate() + '-' + currentDate.getFullYear().toString().slice(-2);
            document.getElementById('display-date').innerText = dateStr;

            if (unsubscribe) unsubscribe();

            const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('reports').doc(dateStr);
            
            unsubscribe = docRef.onSnapshot((doc) => {
                if (doc.exists) {
                    currentData = doc.data();
                    const keys = Object.keys(currentData.revenue || {});
                    const hasLegacy = keys.some(k => !k.includes('_') && k !== 'bank_balance');
                    document.getElementById('legacy-alert').classList.toggle('hidden', !hasLegacy);
                } else {
                    currentData = { revenue: {}, expenses: [], status: 'open' };
                    document.getElementById('legacy-alert').classList.add('hidden');
                }
                updateUI();
            });
        }

        function updateUI() {
            const isLocked = currentData.status === 'submitted';
            const grid = document.getElementById('income-grid');
            grid.innerHTML = '';

            INCOME_CATEGORIES.forEach(cat => {
                const storageKey = `${activeDay}_${cat.replace(/[\/\s]+/g, '_').toLowerCase()}`;
                const val = currentData.revenue?.[storageKey] || '';
                
                grid.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 group hover:border-indigo-200 transition-colors">
                        <div>
                            <span class="text-[10px] font-black uppercase text-slate-400 block tracking-wider">${cat}</span>
                            <span class="text-[8px] font-bold text-indigo-400 uppercase">${activeDay} Entry</span>
                        </div>
                        <div class="flex items-center w-36">
                            <span class="text-sm font-bold text-slate-300 mr-2">$</span>
                            <input type="number" step="0.01" 
                                class="income-input ${isLocked ? 'locked-input' : ''}" 
                                ${isLocked ? 'disabled' : ''}
                                value="${val}"
                                placeholder="0.00"
                                onchange="updateRevenue('${storageKey}', this.value)">
                        </div>
                    </div>
                `;
            });

            const bbInput = document.getElementById('in-bank_balance');
            bbInput.value = currentData.revenue?.bank_balance || '';
            bbInput.disabled = isLocked;

            const list = document.getElementById('expense-list');
            list.innerHTML = '';
            let totalOut = 0;
            let totalIn = 0;

            if (currentData.revenue) {
                Object.keys(currentData.revenue).forEach(key => {
                    if (key !== 'bank_balance' && !isNaN(parseFloat(currentData.revenue[key]))) {
                        totalIn += parseFloat(currentData.revenue[key]);
                    }
                });
            }

            (currentData.expenses || []).forEach((exp, i) => {
                totalOut += parseFloat(exp.amount || 0);
                list.innerHTML += `
                    <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100 group">
                        <div>
                            <p class="text-[10px] font-black uppercase text-slate-400 leading-tight">${exp.category}</p>
                            <p class="text-xs font-bold text-rose-500">-$${parseFloat(exp.amount).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                        </div>
                        <button onclick="removeExpense(${i})" ${isLocked ? 'disabled' : ''} class="${isLocked ? 'hidden' : ''} text-slate-300 hover:text-rose-600 transition-all p-2">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                `;
            });

            const net = totalIn - totalOut;
            document.getElementById('exp-total-badge').innerText = `$${totalOut.toLocaleString(undefined, {minimumFractionDigits: 2})} OUT`;
            document.getElementById('total-revenue-sum').innerText = `$${totalIn.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            
            const totalEl = document.getElementById('total-val');
            totalEl.innerText = (net < 0 ? '-' : '') + '$' + Math.abs(net).toLocaleString(undefined, {minimumFractionDigits: 2});
            totalEl.className = `text-4xl font-black tracking-tighter italic ${net < 0 ? 'text-rose-500' : 'text-emerald-400'}`;

            const sealBtn = document.getElementById('seal-btn');
            sealBtn.innerText = isLocked ? "Report Sealed" : "Finalize Week";
            sealBtn.disabled = isLocked;
            if(isLocked) sealBtn.classList.add('opacity-50');
        }

        async function updateRevenue(fieldId, val) {
            if (!currentData.revenue) currentData.revenue = {};
            currentData.revenue[fieldId] = val;
            save();
        }

        async function addExpense() {
            const cat = document.getElementById('exp-cat').value;
            const amt = document.getElementById('exp-amt').value;
            if(!amt || isNaN(parseFloat(amt))) return;
            if (!currentData.expenses) currentData.expenses = [];
            currentData.expenses.unshift({ category: cat, amount: parseFloat(amt) });
            document.getElementById('exp-amt').value = '';
            save();
        }

        async function removeExpense(idx) {
            currentData.expenses.splice(idx, 1);
            save();
        }

        async function save() {
            const dateStr = (currentDate.getMonth() + 1) + '-' + currentDate.getDate() + '-' + currentDate.getFullYear().toString().slice(-2);
            const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('reports').doc(dateStr);
            await docRef.set(currentData);
        }

        function sealReport() {
            if(confirm("Are you sure you want to seal this week's report? This will disable further editing.")) {
                currentData.status = 'submitted';
                save();
            }
        }
    </script>
</body>
</html>
