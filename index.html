<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voices South Financial Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .btn-toggle { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-toggle.active { background-color: #1e293b; color: white; transform: scale(1.05); }
        .input-inset { background: #f1f5f9; border: 2px solid transparent; transition: all 0.2s; }
        .input-inset:focus { background: white; border-color: #3b82f6; outline: none; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .gradient-border { height: 4px; background: linear-gradient(90deg, #3b82f6, #10b981); border-radius: 2px; margin-bottom: 1rem; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

<div id="app" class="max-w-6xl mx-auto p-4 md:p-8">
    <!-- Loading State -->
    <div id="loading-overlay" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-500 font-medium">Connecting to Secure Portal...</p>
        </div>
    </div>

    <!-- Header -->
    <header class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold text-xl">V</div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">VOICES SOUTH FINANCIALS</h1>
        </div>
        <button onclick="handleLogout()" class="text-xs font-semibold text-slate-400 hover:text-red-500 uppercase tracking-widest transition-colors">Logout</button>
    </header>

    <!-- Date Selector -->
    <div class="glass-card p-6 mb-8 relative overflow-hidden">
        <div class="gradient-border absolute top-0 left-0 w-full"></div>
        <div class="flex items-center justify-between max-w-lg mx-auto">
            <button onclick="changeDate(-7)" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="text-center">
                <div id="display-date" class="text-4xl font-black text-slate-900 mb-1">...</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Week Ending Friday</div>
            </div>
            <button onclick="changeDate(7)" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Income Entry -->
        <section class="glass-card p-8 animate-in">
            <div class="flex items-center gap-2 mb-6">
                <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400">Weekly Income Entry</h2>
            </div>

            <div class="flex gap-2 mb-8 overflow-x-auto pb-2">
                <button onclick="setDay('SUN')" id="btn-sun" class="btn-toggle flex-1 py-3 px-4 rounded-xl text-xs font-bold uppercase tracking-tighter bg-white border border-slate-200">Sun</button>
                <button onclick="setDay('TUE')" id="btn-tue" class="btn-toggle flex-1 py-3 px-4 rounded-xl text-xs font-bold uppercase tracking-tighter bg-white border border-slate-200">Tue</button>
                <button onclick="setDay('EOW')" id="btn-eow" class="btn-toggle flex-1 py-3 px-4 rounded-xl text-xs font-bold uppercase tracking-tighter bg-white border border-slate-200">EOW</button>
                <button onclick="setDay('EOM')" id="btn-eom" class="btn-toggle flex-1 py-3 px-4 rounded-xl text-xs font-bold uppercase tracking-tighter bg-white border border-slate-200">EOM</button>
            </div>

            <div id="income-inputs" class="space-y-6"></div>

            <div class="mt-8 pt-8 border-t border-slate-100">
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Bank Balance (Statement Closing)</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 font-bold">$</span>
                    <input type="number" id="bank-balance" oninput="updateBankBalance(this.value)" placeholder="0.00" class="w-full input-inset p-4 pl-8 rounded-2xl font-bold text-slate-900 text-lg">
                </div>
            </div>
        </section>

        <div class="space-y-8">
            <section class="glass-card p-8 animate-in" style="animation-delay: 0.1s">
                <div class="flex items-center gap-2 mb-6">
                    <div class="w-2 h-2 rounded-full bg-rose-500"></div>
                    <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400">Log Expense</h2>
                </div>
                <div class="space-y-4">
                    <input type="text" id="exp-desc" placeholder="Expense Description" class="w-full input-inset p-4 rounded-2xl font-semibold text-slate-700">
                    <div class="flex gap-4">
                        <div class="relative flex-1">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 font-bold">$</span>
                            <input type="number" id="exp-amount" placeholder="0.00" class="w-full input-inset p-4 pl-8 rounded-2xl font-bold text-slate-900 text-xl">
                        </div>
                        <button onclick="addExpense()" class="bg-slate-900 text-white w-16 rounded-2xl flex items-center justify-center hover:bg-slate-800 transition-transform active:scale-95 shadow-lg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg>
                        </button>
                    </div>
                </div>
            </section>

            <section class="glass-card p-8 animate-in" style="animation-delay: 0.2s">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                        <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400">Weekly Log</h2>
                    </div>
                    <span id="total-out" class="bg-rose-50 text-rose-600 px-3 py-1 rounded-full text-[10px] font-black uppercase">$0.00 OUT</span>
                </div>
                <div id="expense-list" class="space-y-3 max-h-[300px] overflow-y-auto pr-2"></div>
            </section>
        </div>
    </div>

    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-4xl z-40">
        <div class="bg-slate-900 text-white p-6 md:p-8 rounded-[32px] shadow-2xl flex flex-col md:flex-row items-center justify-between gap-6 border border-white/10">
            <div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Weekly Cash Flow (Net Sum)</div>
                <div id="net-sum" class="text-4xl md:text-5xl font-black text-emerald-400 tracking-tighter">$0.00</div>
            </div>
            <button id="finalize-btn" onclick="finalizeWeek()" class="w-full md:w-auto px-10 py-4 bg-white text-slate-900 font-black rounded-2xl uppercase tracking-widest hover:bg-slate-100 transition-all active:scale-95 shadow-xl">
                Finalize Week
            </button>
        </div>
    </div>

    <div id="custom-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="glass-card max-w-md w-full p-8 shadow-2xl">
            <h3 id="modal-title" class="text-xl font-bold mb-2">Message</h3>
            <p id="modal-body" class="text-slate-500 mb-8 leading-relaxed"></p>
            <div class="flex gap-3 justify-end" id="modal-footer"></div>
        </div>
    </div>
    <div class="h-40"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'voices-south-financials';

    let user = null;
    let currentWeekDate = getNearestFriday(new Date());
    let currentDay = 'SUN';
    let weeklyData = getDefaultState();
    let unsubscribe = null;

    const categories = [
        { id: 'cash', label: 'Cash/Checks' },
        { id: 'cards', label: 'Credit/Debit Cards' },
        { id: 'text', label: 'Text' },
        { id: 'givelify', label: 'Givelify' },
        { id: 'tithely', label: 'Tithely' },
        { id: 'cashapp', label: 'CashApp' },
        { id: 'zelle', label: 'Zelle' },
        { id: 'website', label: 'Website Giving' }
    ];

    function getDefaultState() {
        return {
            income: { 'SUN': {}, 'TUE': {}, 'EOW': {}, 'EOM': {} },
            expenses: [],
            bankBalance: 0,
            finalized: false
        };
    }

    async function initAuth() {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        } catch (error) {
            console.error("Auth Failure:", error);
        }
    }

    onAuthStateChanged(auth, (u) => {
        user = u;
        if (user) setupDataListener();
    });

    function setupDataListener() {
        if (!user) return;
        if (unsubscribe) unsubscribe();

        const dateStr = formatDate(currentWeekDate);
        document.getElementById('display-date').innerText = dateStr;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weeks', dateStr);

        unsubscribe = onSnapshot(docRef, (snap) => {
            if (snap.exists()) {
                weeklyData = { ...getDefaultState(), ...snap.data() };
            } else {
                weeklyData = getDefaultState();
            }
            renderAll();
            document.getElementById('loading-overlay').style.display = 'none';
        }, (err) => {
            console.error("Snapshot error:", err);
            document.getElementById('loading-overlay').style.display = 'none';
        });
    }

    async function saveData() {
        if (!user || weeklyData.finalized) return;
        const dateStr = formatDate(currentWeekDate);
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weeks', dateStr);
        await setDoc(docRef, { ...weeklyData, updatedAt: new Date().toISOString() }, { merge: true });
    }

    function renderAll() {
        const isFinalized = weeklyData.finalized;
        
        // Day Buttons
        ['sun', 'tue', 'eow', 'eom'].forEach(d => {
            const el = document.getElementById(`btn-${d}`);
            if (el) currentDay === d.toUpperCase() ? el.classList.add('active') : el.classList.remove('active');
        });

        // Income
        const incContainer = document.getElementById('income-inputs');
        incContainer.innerHTML = categories.map(cat => {
            const val = weeklyData.income[currentDay]?.[cat.id] || '';
            return `
                <div class="space-y-1">
                    <div class="flex justify-between items-end mb-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${cat.label}</label>
                    </div>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 font-bold">$</span>
                        <input type="number" step="0.01" value="${val}" 
                            oninput="window.updateIncome('${cat.id}', this.value)"
                            ${isFinalized ? 'disabled' : ''}
                            class="w-full input-inset p-4 pl-8 rounded-2xl font-bold text-slate-900 text-lg ${isFinalized ? 'opacity-50' : ''}">
                    </div>
                </div>
            `;
        }).join('');

        // Expenses
        const expList = document.getElementById('expense-list');
        let totalOut = 0;
        if (!weeklyData.expenses?.length) {
            expList.innerHTML = `<div class="text-center py-8 text-slate-300 italic text-sm">No expenses logged</div>`;
        } else {
            expList.innerHTML = weeklyData.expenses.map((exp, i) => {
                totalOut += Number(exp.amount || 0);
                return `
                    <div class="flex items-center justify-between p-4 bg-white border border-slate-100 rounded-2xl">
                        <div class="font-bold text-slate-800">${exp.description}</div>
                        <div class="flex items-center gap-4">
                            <span class="font-black text-rose-500">-$${Number(exp.amount).toFixed(2)}</span>
                            ${!isFinalized ? `<button onclick="window.removeExpense(${i})" class="text-slate-300 hover:text-rose-500">×</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        document.getElementById('total-out').innerText = `$${totalOut.toFixed(2)} OUT`;

        // Totals
        let totalInc = 0;
        Object.values(weeklyData.income).forEach(day => {
            Object.values(day).forEach(v => totalInc += Number(v || 0));
        });
        const net = totalInc - totalOut;
        const netEl = document.getElementById('net-sum');
        netEl.innerText = (net < 0 ? '-$' : '$') + Math.abs(net).toFixed(2);
        netEl.className = `text-4xl md:text-5xl font-black tracking-tighter ${net < 0 ? 'text-rose-400' : 'text-emerald-400'}`;

        document.getElementById('bank-balance').value = weeklyData.bankBalance || '';
        document.getElementById('bank-balance').disabled = isFinalized;
        
        const fBtn = document.getElementById('finalize-btn');
        fBtn.innerText = isFinalized ? "Locked (Finalized)" : "Finalize Week";
        fBtn.disabled = isFinalized;
        if (isFinalized) fBtn.classList.add('opacity-50', 'cursor-not-allowed');
    }

    // Window Globals
    window.setDay = (day) => { currentDay = day; renderAll(); };
    window.changeDate = (days) => { currentWeekDate.setDate(currentWeekDate.getDate() + days); setupDataListener(); };
    window.updateIncome = (cat, val) => { 
        if (!weeklyData.income[currentDay]) weeklyData.income[currentDay] = {};
        weeklyData.income[currentDay][cat] = val; 
        saveData(); 
        renderAll();
    };
    window.updateBankBalance = (val) => { weeklyData.bankBalance = val; saveData(); };
    window.addExpense = () => {
        const d = document.getElementById('exp-desc'), a = document.getElementById('exp-amount');
        if (!d.value || !a.value) return;
        weeklyData.expenses.push({ description: d.value, amount: a.value });
        d.value = ''; a.value = '';
        saveData(); renderAll();
    };
    window.removeExpense = (i) => { weeklyData.expenses.splice(i, 1); saveData(); renderAll(); };
    window.finalizeWeek = () => {
        if (confirm("Finalize this week? This cannot be undone.")) {
            weeklyData.finalized = true;
            saveData(); renderAll();
        }
    };
    window.handleLogout = () => auth.signOut().then(() => location.reload());

    function getNearestFriday(d) {
        const date = new Date(d);
        const day = date.getDay();
        const diff = (day <= 5) ? (5 - day) : (12 - day);
        date.setDate(date.getDate() + diff);
        date.setHours(0,0,0,0);
        return date;
    }
    function formatDate(d) { return `${d.getMonth() + 1}-${d.getDate()}-${d.getFullYear().toString().substr(-2)}`; }

    initAuth();
</script>
</body>
</html>
