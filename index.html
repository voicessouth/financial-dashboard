<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voices South Financial Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // RULE 1: Use the global environment App ID for all paths
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // UI State
        let currentIncome = {};
        let expenses = [];
        const incomeCats = ['Cash/Checks', 'Credit Card', 'Text', 'Givelify', 'Tithely', 'CashApp', 'Zelle', 'Website Giving'];
        const expenseCats = ['Lady Val Payroll', 'Mortgage - Kirkland Group', 'Georgia Power', 'Georgia Natural Gas', 'Spectrum', 'Water Authority', 'Pest Control', 'Payroll Taxes', 'Band Payroll', 'Love Offerings', 'Ministry Design', 'Other'];

        // Date calculation (Weekly buckets)
        const getWeekKey = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
            const monday = new Date(d.setDate(diff));
            return `${monday.getMonth() + 1}-${monday.getDate()}-${monday.getFullYear()}`;
        };
        let dateKey = getWeekKey(new Date());

        async function initApp() {
            try {
                // RULE 3: Secure Auth FIRST
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth failed:", err);
                updateStatus("Authentication Failed", "bg-rose-500");
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log("Session Active:", user.uid);
                    setupDataListeners();
                    renderIncomeFields();
                    renderExpenseOptions();
                    document.getElementById('dateDisplay').innerText = dateKey;
                    updateStatus("Cloud Sync Online", "bg-emerald-500");
                } else {
                    updateStatus("Waiting for Session...", "bg-amber-500 animate-pulse");
                }
            });
        }

        function updateStatus(text, colorClass) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusText');
            dot.className = `w-2 h-2 rounded-full ${colorClass}`;
            label.innerText = text;
        }

        function setupDataListeners() {
            if (!auth.currentUser) return;

            // RULE 1 & 2: Public data pathing with simple queries
            const incomeDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'income_summaries', dateKey);
            const expensesColRef = collection(db, 'artifacts', appId, 'public', 'data', `expenses_${dateKey}`);

            // Income Stream
            onSnapshot(incomeDocRef, (snap) => {
                if (snap.exists()) {
                    currentIncome = snap.data().income || {};
                    updateUIInputs();
                }
                calculateTotals();
            }, (err) => {
                console.error("Income Error:", err);
                updateStatus("Income Access Error", "bg-rose-500");
            });

            // Expense Stream
            onSnapshot(expensesColRef, (snap) => {
                expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderExpenseList();
                calculateTotals();
            }, (err) => {
                console.error("Expense Error:", err);
                updateStatus("Expense Access Denied", "bg-rose-500");
            });
        }

        function renderIncomeFields() {
            const container = document.getElementById('incomeFields');
            container.innerHTML = incomeCats.map(cat => `
                <div class="flex justify-between items-center py-2.5 border-b border-slate-50">
                    <label class="text-[11px] font-black text-slate-400 uppercase tracking-tight">${cat}</label>
                    <div class="flex items-center gap-1">
                        <span class="text-slate-300 font-bold text-sm">$</span>
                        <input type="number" step="0.01" data-cat="${cat}" onchange="saveIncome('${cat}', this.value)" placeholder="0.00" 
                        class="income-input w-24 text-right font-black text-slate-800 outline-none bg-transparent">
                    </div>
                </div>
            `).join('');
        }

        function renderExpenseOptions() {
            const select = document.getElementById('expenseCategory');
            select.innerHTML = expenseCats.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        window.saveIncome = async (cat, val) => {
            if (!auth.currentUser) return;
            const num = parseFloat(val) || 0;
            currentIncome[cat] = num;
            
            const incomeDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'income_summaries', dateKey);
            try {
                await setDoc(incomeDocRef, { income: currentIncome, lastUpdated: new Date().toISOString() }, { merge: true });
            } catch (e) {
                console.error("Save failed", e);
            }
        };

        window.addExpense = async () => {
            if (!auth.currentUser) return;
            const cat = document.getElementById('expenseCategory').value;
            const amtInput = document.getElementById('expenseAmount');
            const amt = parseFloat(amtInput.value) || 0;
            if (amt <= 0) return;

            const id = Date.now().toString();
            const expenseDocRef = doc(db, 'artifacts', appId, 'public', 'data', `expenses_${dateKey}`, id);
            
            try {
                await setDoc(expenseDocRef, {
                    category: cat,
                    amount: amt,
                    timestamp: new Date().toISOString(),
                    uid: auth.currentUser.uid
                });
                amtInput.value = '';
            } catch (e) {
                console.error("Add failed", e);
            }
        };

        window.removeExpense = async (id) => {
            if (!auth.currentUser) return;
            const expenseDocRef = doc(db, 'artifacts', appId, 'public', 'data', `expenses_${dateKey}`, id);
            try {
                await deleteDoc(expenseDocRef);
            } catch (e) {
                console.error("Delete failed", e);
            }
        };

        function updateUIInputs() {
            document.querySelectorAll('.income-input').forEach(input => {
                const cat = input.dataset.cat;
                if (document.activeElement !== input) {
                    input.value = currentIncome[cat] || '';
                }
            });
        }

        function renderExpenseList() {
            const list = document.getElementById('expenseList');
            if (expenses.length === 0) {
                list.innerHTML = '<div class="text-center py-12"><p class="text-[10px] font-bold text-slate-300 uppercase tracking-widest">No expenses logged this week</p></div>';
                return;
            }
            list.innerHTML = expenses.map(exp => `
                <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100 group transition-all hover:border-slate-200">
                    <div>
                        <p class="text-[11px] font-black text-slate-800 uppercase leading-none mb-1">${exp.category}</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">${new Date(exp.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-black text-rose-500 text-sm">-$${exp.amount.toFixed(2)}</span>
                        <button onclick="removeExpense('${exp.id}')" class="text-slate-300 hover:text-rose-600 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function calculateTotals() {
            const totalInc = Object.values(currentIncome).reduce((a, b) => a + b, 0);
            const totalExp = expenses.reduce((a, b) => a + b.amount, 0);
            const net = totalInc - totalExp;

            document.getElementById('totalIncomeDisplay').innerText = `$${totalInc.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('totalExpenseDisplay').innerText = `$${totalExp.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('netCashDisplay').innerText = `$${net.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        }

        window.onload = initApp;
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen pb-32">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 px-6 py-5">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 w-12 h-12 flex items-center justify-center rounded-2xl text-white shadow-xl shadow-indigo-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight leading-none text-slate-900">Voices South</h1>
                    <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mt-1.5 flex items-center gap-1.5">
                        <span class="text-indigo-600">Reporting Week:</span>
                        <span id="dateDisplay">...</span>
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-3 px-4 py-2 bg-slate-50 border border-slate-100 rounded-2xl">
                <div id="statusDot" class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></div>
                <span id="statusText" class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Initializing Secure Link...</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-10 space-y-10">
        
        <!-- Dashboard Summary -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm transition-transform hover:scale-[1.02]">
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Total Receipts</p>
                <p id="totalIncomeDisplay" class="text-4xl font-black text-emerald-600 tracking-tight">$0.00</p>
            </div>
            <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm transition-transform hover:scale-[1.02]">
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Total Disbursements</p>
                <p id="totalExpenseDisplay" class="text-4xl font-black text-slate-900 tracking-tight">$0.00</p>
            </div>
            <div class="bg-indigo-600 p-8 rounded-[2rem] shadow-2xl shadow-indigo-200 text-white transition-transform hover:scale-[1.02]">
                <p class="text-[11px] font-black text-indigo-200 uppercase tracking-widest mb-2">Net Weekly Cash</p>
                <p id="netCashDisplay" class="text-4xl font-black tracking-tight">$0.00</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Income Section -->
            <section class="lg:col-span-5 bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-sm font-black text-slate-900 uppercase tracking-widest">Revenue Entry</h2>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase">Updates automatically</p>
                    </div>
                    <div class="bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">
                        <span class="text-[9px] font-black text-emerald-600 uppercase tracking-tighter">Live Sync</span>
                    </div>
                </div>
                <div id="incomeFields" class="space-y-1">
                    <!-- Dynamic -->
                </div>
            </section>

            <!-- Expense Section -->
            <section class="lg:col-span-7 space-y-8">
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                    <h2 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-8">Log Disbursement</h2>
                    <div class="flex flex-col md:flex-row gap-4">
                        <select id="expenseCategory" class="flex-1 bg-slate-50 border border-slate-100 p-4 rounded-2xl text-sm font-black text-slate-700 outline-none focus:ring-4 ring-indigo-500/10 appearance-none">
                            <!-- Dynamic -->
                        </select>
                        <div class="flex flex-1 gap-2">
                            <input type="number" id="expenseAmount" placeholder="0.00" class="flex-1 bg-slate-50 border border-slate-100 p-4 rounded-2xl text-sm font-black outline-none focus:ring-4 ring-indigo-500/10">
                            <button onclick="addExpense()" class="bg-slate-900 text-white px-8 rounded-2xl hover:bg-black transition-all active:scale-95 shadow-xl shadow-slate-200">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-sm font-black text-slate-900 uppercase tracking-widest">Expense Ledger</h2>
                        <span class="text-[9px] font-bold text-slate-300 uppercase tracking-widest">Recent Activity</span>
                    </div>
                    <div id="expenseList" class="space-y-3 max-h-[500px] overflow-y-auto custom-scrollbar pr-3">
                        <!-- Dynamic -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-lg px-6 no-print">
        <button onclick="window.print()" class="w-full bg-slate-900 hover:bg-black text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-2xl transition-all active:scale-95 flex items-center justify-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Generate Financial Statement
        </button>
    </footer>

</body>
</html>
