<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Church Financial Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { margin: 0; background-color: #f8fafc; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- This is where the React Dashboard will load -->
    <div id="root"></div>

    <!-- Error Handling Script: Shows a message if the dashboard fails to load -->
    <script>
      window.onerror = function(msg, url, line) {
        const root = document.getElementById('root');
        root.innerHTML = `
          <div style="padding: 40px 20px; font-family: sans-serif; text-align: center; max-width: 500px; margin: auto;">
            <div style="background: white; padding: 30px; border-radius: 20px; border: 1px solid #e2e8f0; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
              <h2 style="color: #e11d48; margin-top: 0;">Dashboard Load Error</h2>
              <p style="color: #64748b; font-size: 14px;">The app couldn't find your code file. Please ensure <b>src/App.jsx</b> exists on GitHub.</p>
              <div style="background: #f1f5f9; padding: 10px; border-radius: 8px; font-size: 12px; color: #475569; word-break: break-all;">
                <code>${msg}</code>
              </div>
              <button onclick="window.location.reload()" style="margin-top: 20px; background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold;">Retry Loading</button>
            </div>
          </div>
        `;
        return false;
      };
    </script>

    <!-- This script tells the browser to run your dashboard code -->
    <!-- It searches for App.jsx inside the src folder -->
    <script type="module" src="/src/App.jsx"></script>
  </body>
</html>
