<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voices South Financial Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07); border-radius: 2rem; }
        .input-inset { background: #f1f5f9; border: 2px solid transparent; transition: all 0.2s; }
        .input-inset:focus { border-color: #1e293b; background: white; outline: none; }
        .btn-primary { background: #0f172a; color: white; transition: transform 0.1s; }
        .btn-primary:active { transform: scale(0.95); }
        .gradient-border { position: relative; }
        .gradient-border::after { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; height: 4px; background: linear-gradient(90deg, #3b82f6, #10b981); border-radius: 2rem 2rem 0 0; }
        
        /* Spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white">
        <div class="loader mb-4"></div>
        <p id="loading-text" class="text-slate-500 font-medium">Connecting to Secure Portal...</p>
        <button id="retry-btn" class="hidden mt-6 px-6 py-2 bg-slate-100 rounded-full text-sm font-semibold hover:bg-slate-200">Continue with Limited Access</button>
    </div>

    <!-- Header -->
    <header class="px-6 py-4 flex justify-between items-center bg-white border-b sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="bg-slate-900 text-white w-10 h-10 rounded-lg flex items-center justify-center font-bold text-xl shadow-lg">V</div>
            <h1 class="font-extrabold tracking-tight text-slate-900">VOICES SOUTH FINANCIALS</h1>
        </div>
        <button onclick="window.location.reload()" class="text-xs font-bold text-slate-400 hover:text-slate-900 uppercase tracking-widest">Logout</button>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-8">
        
        <!-- Date Selector -->
        <div class="glass-card gradient-border p-8 flex items-center justify-between">
            <button onclick="changeDate(-7)" class="p-4 hover:bg-slate-100 rounded-2xl transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="text-center">
                <div id="current-date-display" class="text-5xl font-black tracking-tighter text-slate-900">--/--/--</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-2">Week Ending Friday</div>
            </div>
            <button onclick="changeDate(7)" class="p-4 hover:bg-slate-100 rounded-2xl transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Left: Income Entry -->
            <div class="glass-card p-8 space-y-6">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Weekly Income Entry</h2>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex gap-2 mb-8">
                    <button id="tab-SUN" onclick="setTab('SUN')" class="flex-1 py-3 rounded-xl font-bold text-xs transition-all bg-slate-900 text-white shadow-lg">SUN</button>
                    <button id="tab-TUE" onclick="setTab('TUE')" class="flex-1 py-3 rounded-xl font-bold text-xs transition-all bg-white text-slate-400 border hover:bg-slate-50">TUE</button>
                    <button id="tab-EOW" onclick="setTab('EOW')" class="flex-1 py-3 rounded-xl font-bold text-xs transition-all bg-white text-slate-400 border hover:bg-slate-50">EOW</button>
                    <button id="tab-EOM" onclick="setTab('EOM')" class="flex-1 py-3 rounded-xl font-bold text-xs transition-all bg-white text-slate-400 border hover:bg-slate-50">EOM</button>
                </div>

                <!-- Income Inputs -->
                <div id="income-container" class="space-y-4">
                    <!-- Dynamic inputs injected by JS -->
                </div>
            </div>

            <!-- Right: Expenses -->
            <div class="space-y-8">
                <!-- Log Expense -->
                <div class="glass-card p-8">
                    <div class="flex items-center gap-2 mb-6">
                        <div class="w-2 h-2 rounded-full bg-rose-500"></div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Log Expense</h2>
                    </div>
                    <div class="space-y-4">
                        <input type="text" id="exp-name" placeholder="Expense Category (e.g. Mortgage)" class="w-full p-4 rounded-xl input-inset font-semibold text-sm">
                        <div class="flex gap-4">
                            <input type="number" id="exp-amount" placeholder="0.00" class="flex-1 p-4 rounded-xl input-inset font-bold text-2xl">
                            <button onclick="addExpense()" class="w-16 h-16 btn-primary rounded-2xl flex items-center justify-center shadow-xl">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 6v12m6-6H6"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Weekly Log -->
                <div class="glass-card p-8 min-h-[300px]">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Weekly Log</h2>
                        <span id="total-out-badge" class="bg-rose-50 text-rose-600 px-3 py-1 rounded-full text-[10px] font-black uppercase">$0.00 OUT</span>
                    </div>
                    <div id="expenses-list" class="space-y-3">
                        <p class="text-center text-slate-300 py-12 text-sm italic">No expenses logged for this week.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bank Balance -->
        <div class="glass-card p-8">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Bank Balance</h2>
                    <p class="text-[10px] text-slate-300 font-bold uppercase">Statement Closing</p>
                </div>
                <div class="relative max-w-[200px]">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 font-bold">$</span>
                    <input type="number" id="bank-balance" onchange="saveData()" placeholder="0.00" class="w-full pl-8 pr-4 py-3 rounded-xl input-inset font-bold text-xl text-right">
                </div>
            </div>
        </div>

        <div class="h-24"></div> <!-- Spacer -->
    </main>

    <!-- Bottom Bar -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-full max-w-3xl px-4 z-50">
        <div class="bg-slate-900 text-white rounded-[2.5rem] p-6 flex items-center justify-between shadow-2xl border border-slate-800">
            <div>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Weekly Cash Flow (Net Sum)</p>
                <div id="net-cash-flow" class="text-4xl font-black text-emerald-400 tracking-tighter">$0.00</div>
            </div>
            <button id="finalize-btn" onclick="finalizeWeek()" class="bg-white text-slate-900 px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-100 transition-colors">
                Finalize Week
            </button>
        </div>
    </div>

    <!-- Toast UI -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full text-xs font-bold shadow-2xl opacity-0 transition-opacity pointer-events-none z-50">
        Changes Saved
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        let db, auth, user;
        let currentTab = 'SUN';
        let currentWeekEnd = null;
        let weeklyData = {
            income: {},
            expenses: [],
            bankBalance: 0,
            isFinalized: false
        };

        const INCOME_CATEGORIES = [
            "Cash/Checks", "Credit/Debit Cards", "Text", "Givelify", 
            "Tithely", "CashApp", "Zelle", "Website Giving"
        ];

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'voices-south-financial-v2';

        // --- Initializers ---

        async function init() {
            const timeout = setTimeout(() => {
                document.getElementById('loading-text').innerText = "Auth delay detected...";
                document.getElementById('retry-btn').classList.remove('hidden');
            }, 6000);

            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Standard Auth flow
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                
                await initAuth();

                onAuthStateChanged(auth, (u) => {
                    user = u;
                    if (user) {
                        clearTimeout(timeout);
                        document.getElementById('loading-screen').classList.add('hidden');
                        initDate();
                        renderIncome();
                    }
                });

            } catch (err) {
                console.error("Initialization Error:", err);
                // Fallback to local UI if config/auth fails
                document.getElementById('loading-screen').classList.add('hidden');
                initDate();
                renderIncome();
            }
        }

        function initDate() {
            currentWeekEnd = getNearestFriday(new Date());
            updateDateUI();
            loadWeekData();
        }

        function getNearestFriday(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = (day <= 5) ? (5 - day) : (12 - day);
            d.setDate(d.getDate() + diff);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        window.changeDate = (days) => {
            currentWeekEnd.setDate(currentWeekEnd.getDate() + days);
            updateDateUI();
            loadWeekData();
        };

        function updateDateUI() {
            const m = currentWeekEnd.getMonth() + 1;
            const d = currentWeekEnd.getDate();
            const y = currentWeekEnd.getFullYear().toString().slice(-2);
            document.getElementById('current-date-display').innerText = `${m}-${d}-${y}`;
        }

        // --- Data Persistence ---

        let unsubscribe = null;
        async function loadWeekData() {
            if (!user) return;
            if (unsubscribe) unsubscribe();
            
            const dateStr = currentWeekEnd.toISOString().split('T')[0];
            
            // CORRECT PATH FOR SECURITY RULES: /artifacts/{appId}/users/{userId}/weeks/{date}
            const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'weeks', dateStr);

            unsubscribe = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    weeklyData = docSnap.data();
                } else {
                    weeklyData = { income: {}, expenses: [], bankBalance: 0, isFinalized: false };
                }
                renderIncome();
                renderExpenses();
                updateTotals();
            }, (error) => {
                console.error("Firestore Permission/Access Error:", error);
                // If permission denied, check if we're using public path or user path
                // This app uses the user-specific path for security
            });
        }

        async function saveData() {
            if (!user) return;
            
            const dateStr = currentWeekEnd.toISOString().split('T')[0];
            const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'weeks', dateStr);
            
            // Sync current screen inputs to memory state
            INCOME_CATEGORIES.forEach(cat => {
                const id = `in-${cat.replace(/\//g, '-')}`;
                const el = document.getElementById(id);
                if (el) {
                    const val = parseFloat(el.value) || 0;
                    if (!weeklyData.income[currentTab]) weeklyData.income[currentTab] = {};
                    weeklyData.income[currentTab][cat] = val;
                }
            });
            
            weeklyData.bankBalance = parseFloat(document.getElementById('bank-balance').value) || 0;

            try {
                await setDoc(docRef, weeklyData);
                showToast("Data Synced");
            } catch (err) {
                console.error("Firestore Write Error:", err);
            }
        }

        // --- UI Interactions ---

        window.setTab = (tab) => {
            // Pre-sync current inputs
            INCOME_CATEGORIES.forEach(cat => {
                const id = `in-${cat.replace(/\//g, '-')}`;
                const el = document.getElementById(id);
                if (el) {
                    const val = parseFloat(el.value) || 0;
                    if (!weeklyData.income[currentTab]) weeklyData.income[currentTab] = {};
                    weeklyData.income[currentTab][cat] = val;
                }
            });

            currentTab = tab;
            ['SUN', 'TUE', 'EOW', 'EOM'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-3 rounded-xl font-bold text-xs transition-all bg-slate-900 text-white shadow-lg";
                } else {
                    btn.className = "flex-1 py-3 rounded-xl font-bold text-xs transition-all bg-white text-slate-400 border hover:bg-slate-50";
                }
            });
            renderIncome();
        };

        function renderIncome() {
            const container = document.getElementById('income-container');
            const data = weeklyData.income[currentTab] || {};
            
            container.innerHTML = INCOME_CATEGORIES.map(cat => {
                const val = data[cat] || 0;
                const id = `in-${cat.replace(/\//g, '-')}`;
                return `
                    <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-transparent hover:border-slate-200 transition-all">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${cat}</p>
                            <p class="text-[8px] font-bold text-blue-500 uppercase">${currentTab} ENTRY</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-slate-300 font-bold">$</span>
                            <input type="number" id="${id}" value="${val}" 
                                onchange="saveData()"
                                placeholder="0.00" 
                                class="w-32 bg-transparent text-right font-black text-xl text-slate-800 focus:outline-none">
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('bank-balance').value = weeklyData.bankBalance || "";
            updateTotals();
        }

        function renderExpenses() {
            const list = document.getElementById('expenses-list');
            if (!weeklyData.expenses || weeklyData.expenses.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-300 py-12 text-sm italic">No expenses logged for this week.</p>`;
                return;
            }

            list.innerHTML = weeklyData.expenses.map((exp, idx) => `
                <div class="flex items-center justify-between p-4 bg-white border border-slate-100 rounded-2xl shadow-sm group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-rose-50 flex items-center justify-center text-rose-500">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"></path><path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clip-rule="evenodd"></path></svg>
                        </div>
                        <span class="font-bold text-sm text-slate-700">${exp.name}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-black text-slate-900">$${exp.amount.toLocaleString(undefined, {minimumFractionDigits:2})}</span>
                        <button onclick="removeExpense(${idx})" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-rose-500 transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.addExpense = () => {
            const name = document.getElementById('exp-name').value;
            const amount = parseFloat(document.getElementById('exp-amount').value);
            if (!name || isNaN(amount)) return;

            if (!weeklyData.expenses) weeklyData.expenses = [];
            weeklyData.expenses.push({ name, amount });
            document.getElementById('exp-name').value = '';
            document.getElementById('exp-amount').value = '';
            saveData();
        };

        window.removeExpense = (idx) => {
            weeklyData.expenses.splice(idx, 1);
            saveData();
        };

        function updateTotals() {
            let totalIn = 0;
            if (weeklyData.income) {
                Object.keys(weeklyData.income).forEach(day => {
                    Object.values(weeklyData.income[day]).forEach(val => totalIn += val);
                });
            }

            const totalOut = (weeklyData.expenses || []).reduce((sum, exp) => sum + exp.amount, 0);
            const net = totalIn - totalOut;

            const badge = document.getElementById('total-out-badge');
            if (badge) badge.innerText = `$${totalOut.toLocaleString(undefined, {minimumFractionDigits:2})} OUT`;
            
            const netEl = document.getElementById('net-cash-flow');
            if (netEl) {
                netEl.innerText = `$${net.toLocaleString(undefined, {minimumFractionDigits:2})}`;
                netEl.className = net < 0 
                    ? "text-4xl font-black text-rose-400 tracking-tighter" 
                    : "text-4xl font-black text-emerald-400 tracking-tighter";
            }

            const finalizeBtn = document.getElementById('finalize-btn');
            if (finalizeBtn) {
                if (weeklyData.isFinalized) {
                    finalizeBtn.innerText = "Week Finalized";
                    finalizeBtn.className = "bg-emerald-500 text-white px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest pointer-events-none";
                } else {
                    finalizeBtn.innerText = "Finalize Week";
                    finalizeBtn.className = "bg-white text-slate-900 px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-100 transition-colors";
                }
            }
        }

        window.finalizeWeek = () => {
            if (confirm("Lock this week? You won't be able to edit unless you contact admin.")) {
                weeklyData.isFinalized = true;
                saveData();
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (t) {
                t.innerText = msg;
                t.style.opacity = '1';
                setTimeout(() => t.style.opacity = '0', 2000);
            }
        }

        // Initialize App
        init();

    </script>
</body>
</html>
