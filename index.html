<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voices South Financial Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; }
        .hidden { display: none !important; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-[100]">
        <div class="w-full max-w-md bg-white rounded-[2.5rem] p-10 text-slate-900 shadow-2xl">
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-white mx-auto mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <h1 class="text-2xl font-black uppercase tracking-tighter text-slate-900">Voices South</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Financial Portal v2.5</p>
            </div>
            <div class="space-y-4">
                <input id="login-id" type="text" placeholder="Admin ID" class="w-full px-5 py-4 bg-slate-100 rounded-xl font-bold border-2 border-transparent focus:border-indigo-500 transition-all outline-none">
                <input id="login-pw" type="password" placeholder="Password" class="w-full px-5 py-4 bg-slate-100 rounded-xl font-bold border-2 border-transparent focus:border-indigo-500 transition-all outline-none">
                <button onclick="handleLogin()" id="login-btn" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase tracking-widest hover:bg-indigo-600 transition-all shadow-xl">Enter Dashboard</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-screen" class="hidden min-h-screen pb-48">
        <nav class="bg-white border-b p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm px-6">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white text-xs font-black">V</div>
                <span class="font-black text-xs uppercase tracking-tighter text-slate-900">Financial Dashboard</span>
            </div>
            <button onclick="location.reload()" class="text-[10px] font-black uppercase text-slate-400 hover:text-rose-500 transition-colors">Logout</button>
        </nav>

        <div class="max-w-5xl mx-auto p-6 space-y-6">
            <!-- Date Navigation Header -->
            <div class="bg-white p-8 rounded-[2.5rem] border shadow-sm text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-emerald-500"></div>
                <div class="flex items-center justify-between max-w-xs mx-auto mb-2">
                    <button onclick="changeDate(-7)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <h2 id="display-date" class="text-3xl font-black tracking-tighter italic text-slate-900">...</h2>
                    <button onclick="changeDate(7)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>
                <div class="flex items-center justify-center gap-2">
                    <div id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span id="sync-status" class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Live Database Link</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- REVENUE ENTRY -->
                <div class="bg-white p-7 rounded-[2.5rem] border shadow-sm">
                    <h3 class="font-black text-[11px] uppercase tracking-[0.2em] text-slate-400 mb-6 flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-200"></span> Weekly Income
                    </h3>
                    <div id="income-grid" class="space-y-3">
                        <!-- Fields are hardcoded in the renderUI function -->
                    </div>
                </div>

                <!-- EXPENSES -->
                <div class="space-y-6">
                    <div class="bg-white p-7 rounded-[2.5rem] border shadow-sm">
                        <h3 class="font-black text-[11px] uppercase tracking-[0.2em] text-slate-400 mb-6 flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full bg-rose-500 shadow-lg shadow-rose-200"></span> Log Expense
                        </h3>
                        <div class="space-y-3">
                            <select id="exp-cat" class="w-full p-4 bg-slate-50 rounded-2xl text-xs font-bold border-2 border-transparent focus:border-indigo-500 outline-none">
                                <option>Mortgage - Kirkland Group</option>
                                <option>Pastor Payroll</option>
                                <option>Lady Val Payroll</option>
                                <option>Admin Payroll Taxes</option>
                                <option>Band Payroll</option>
                                <option>Georgia Power</option>
                                <option>Georgia Natural Gas</option>
                                <option>Spectrum</option>
                                <option>Water Authority</option>
                                <option>TMobile</option>
                                <option>Ministry Design</option>
                                <option>Quickbooks</option>
                                <option>GFL Environmental</option>
                                <option>Other/Misc</option>
                            </select>
                            <div class="flex gap-2">
                                <input id="exp-amt" type="number" step="0.01" placeholder="Amount" class="flex-1 p-4 bg-slate-50 rounded-2xl font-bold text-lg border-2 border-transparent focus:border-indigo-500 outline-none">
                                <button onclick="addExpense()" class="bg-slate-900 text-white px-8 rounded-2xl font-black text-xl hover:bg-indigo-600 transition-all">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-7 rounded-[2.5rem] border shadow-sm">
                        <h3 class="font-black text-[11px] uppercase tracking-[0.2em] text-slate-400 mb-4">Transaction History</h3>
                        <div id="expense-list" class="space-y-2 max-h-[300px] overflow-y-auto custom-scroll pr-2">
                        </div>
                    </div>
                </div>
            </div>

            <!-- FOOTER TOTALS -->
            <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-4xl bg-slate-900 p-8 rounded-[3rem] text-white flex flex-col md:flex-row justify-between items-center shadow-2xl gap-6 z-40">
                <div class="text-center md:text-left flex-1">
                    <p class="text-[10px] font-black uppercase text-indigo-400 tracking-[0.3em] mb-1">Weekly Cash Flow</p>
                    <p id="total-val" class="text-4xl font-black tracking-tighter italic text-emerald-400">$0.00</p>
                </div>
                <div class="flex flex-col items-center md:items-end gap-1">
                    <button onclick="sealReport()" id="seal-btn" class="bg-white text-black px-10 py-4 rounded-[1.5rem] font-black uppercase text-xs tracking-widest hover:bg-emerald-500 hover:text-white transition-all">
                        Finalize Week
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Use provided configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDb6oFZEStklFT_Dt2riDbQC_IJPHcT304",
            authDomain: "church-finance-dashboard-40dca.firebaseapp.com",
            projectId: "church-finance-dashboard-40dca",
            storageBucket: "church-finance-dashboard-40dca.firebasestorage.app",
            messagingSenderId: "480863076081",
            appId: "1:480863076081:web:dd01f7270a7cd158f93350"
        };

        const appId = "church-finance-dashboard-40dca";
        let db, auth;
        let currentDate = new Date();
        let currentData = { revenue: {}, expenses: [], status: 'open' };

        // Forced Income Categories
        const revenueFields = [
            { id: 'sun_offering', label: 'Sun Offering' },
            { id: 'tue_offering', label: 'Tue Offering' },
            { id: 'eow_total', label: 'End of Week' },
            { id: 'eom_total', label: 'End of Month' },
            { id: 'bank_balance', label: 'Bank Balance', highlight: true }
        ];

        window.onload = async () => {
            // Set date to current Tuesday (Start of church week)
            const day = currentDate.getDay();
            const diff = day >= 2 ? day - 2 : day + 5; 
            currentDate.setDate(currentDate.getDate() - diff);
            
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
                await auth.signInAnonymously();
            } catch (e) {
                console.error("Firebase Error", e);
            }
        };

        function handleLogin() {
            const id = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            if (id === "voicessouth" && pw === "3894South") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                loadWeekData();
            } else {
                alert("Wrong ID/PW");
            }
        }

        function changeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            loadWeekData();
        }

        let unsubscribe = null;
        function loadWeekData() {
            const dateStr = (currentDate.getMonth() + 1) + '-' + currentDate.getDate() + '-' + currentDate.getFullYear().toString().slice(-2);
            document.getElementById('display-date').innerText = dateStr;

            if (unsubscribe) unsubscribe();

            // Correct Artifact Pathing
            const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('reports').doc(dateStr);
            
            unsubscribe = docRef.onSnapshot((doc) => {
                if (doc.exists) {
                    currentData = doc.data();
                } else {
                    currentData = { revenue: {}, expenses: [], status: 'open' };
                }
                renderUI();
            }, (err) => console.error("Snapshot Error", err));
        }

        function renderUI() {
            const isLocked = currentData.status === 'submitted';
            const sealBtn = document.getElementById('seal-btn');
            sealBtn.innerText = isLocked ? "Locked" : "Finalize Week";
            sealBtn.disabled = isLocked;
            sealBtn.className = isLocked ? "bg-slate-700 text-slate-400 px-10 py-4 rounded-[1.5rem] font-black uppercase text-xs tracking-widest cursor-not-allowed" : "bg-white text-black px-10 py-4 rounded-[1.5rem] font-black uppercase text-xs tracking-widest hover:bg-emerald-500 hover:text-white transition-all";

            // Render Revenue Fields
            const grid = document.getElementById('income-grid');
            grid.innerHTML = '';
            let totalIn = 0;

            revenueFields.forEach(field => {
                const val = currentData.revenue?.[field.id] || 0;
                if (field.id !== 'bank_balance') totalIn += parseFloat(val);

                grid.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <span class="text-[10px] font-black uppercase ${field.highlight ? 'text-indigo-500' : 'text-slate-500'}">${field.label}</span>
                        <div class="flex items-center">
                            <span class="text-xs font-bold text-slate-300 mr-1">$</span>
                            <input type="number" step="0.01" value="${val}" ${isLocked ? 'disabled' : ''} 
                                onchange="updateRevenue('${field.id}', this.value)" 
                                class="w-32 text-right bg-transparent font-black text-sm outline-none ${field.highlight ? 'text-indigo-600' : 'text-slate-900'}">
                        </div>
                    </div>
                `;
            });

            // Render Expenses
            const list = document.getElementById('expense-list');
            list.innerHTML = '';
            let totalOut = 0;
            const exps = currentData.expenses || [];
            
            if (exps.length === 0) {
                list.innerHTML = `<p class="text-center py-6 text-[10px] font-bold text-slate-300 uppercase italic">No activity logged</p>`;
            } else {
                exps.forEach((exp, i) => {
                    totalOut += parseFloat(exp.amount || 0);
                    list.innerHTML += `
                        <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100 group">
                            <div>
                                <p class="text-[10px] font-black uppercase text-slate-400 leading-tight">${exp.category}</p>
                                <p class="text-xs font-bold text-rose-500">-$${parseFloat(exp.amount).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                            </div>
                            <button onclick="removeExpense(${i})" ${isLocked ? 'disabled' : ''} class="opacity-0 group-hover:opacity-100 text-rose-300 hover:text-rose-600 transition-all ${isLocked ? 'hidden' : ''}">
                                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                            </button>
                        </div>
                    `;
                });
            }

            const net = totalIn - totalOut;
            const totalEl = document.getElementById('total-val');
            totalEl.innerText = (net < 0 ? '-' : '') + '$' + Math.abs(net).toLocaleString(undefined, {minimumFractionDigits: 2});
            totalEl.className = `text-4xl font-black tracking-tighter italic ${net < 0 ? 'text-rose-500' : 'text-emerald-400'}`;
        }

        async function updateRevenue(fieldId, val) {
            if (!currentData.revenue) currentData.revenue = {};
            currentData.revenue[fieldId] = val;
            saveToFirebase();
        }

        async function addExpense() {
            const cat = document.getElementById('exp-cat').value;
            const amt = document.getElementById('exp-amt').value;
            if(!amt) return;
            if (!currentData.expenses) currentData.expenses = [];
            currentData.expenses.unshift({ category: cat, amount: amt, time: Date.now() });
            document.getElementById('exp-amt').value = '';
            saveToFirebase();
        }

        async function removeExpense(idx) {
            currentData.expenses.splice(idx, 1);
            saveToFirebase();
        }

        async function saveToFirebase() {
            const dateStr = (currentDate.getMonth() + 1) + '-' + currentDate.getDate() + '-' + currentDate.getFullYear().toString().slice(-2);
            const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('reports').doc(dateStr);
            await docRef.set(currentData);
        }

        function sealReport() {
            if(confirm("Seal this week? This cannot be undone.")) {
                currentData.status = 'submitted';
                saveToFirebase();
            }
        }
    </script>
</body>
</html>
