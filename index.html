<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voices South Financial Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDb6oFZEStklFT_Dt2riDbQC_IJPHcT304",
            authDomain: "church-finance-dashboard-40dca.firebaseapp.com",
            projectId: "church-finance-dashboard-40dca",
            storageBucket: "church-finance-dashboard-40dca.firebasestorage.app",
            messagingSenderId: "480863076081",
            appId: "1:480863076081:web:dd01f7270a7cd158f93350"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // RULE 1: Global Variables for path construction
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'church-finance-dashboard-40dca';

        // UI State
        let currentIncome = {};
        let expenses = [];
        const incomeCats = ['Cash/Checks', 'Credit Card', 'Text', 'Givelify', 'Tithely', 'CashApp', 'Zelle', 'Website Giving'];
        const expenseCats = ['Lady Val Payroll', 'Mortgage - Kirkland Group', 'Georgia Power', 'Georgia Natural Gas', 'Spectrum', 'Water Authority', 'Pest Control', 'Payroll Taxes', 'Band Payroll', 'Love Offerings', 'Ministry Design', 'Other'];

        // Date calculation
        const getWeekKey = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
            const monday = new Date(d.setDate(diff));
            return `${monday.getMonth() + 1}-${monday.getDate()}-${monday.getFullYear()}`;
        };
        let dateKey = getWeekKey(new Date());

        async function initApp() {
            // RULE 3: Auth Before Queries - await the sign in process
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth failed:", err);
                document.getElementById('statusText').innerText = "Auth Failed";
            }

            // Listen for auth state change to trigger Firestore
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log("Authenticated as:", user.uid);
                    setupListeners();
                    renderIncomeFields();
                    renderExpenseOptions();
                    document.getElementById('dateDisplay').innerText = dateKey;
                }
            });
        }

        function setupListeners() {
            // Ensure we have a user before starting listeners
            if (!auth.currentUser) return;

            // RULE 1: Strict Paths - artifacts/{appId}/public/data/{collectionName}
            const incomeDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'income_summaries', dateKey);
            const expensesColRef = collection(db, 'artifacts', appId, 'public', 'data', `expenses_log_${dateKey}`);

            // Listen for Income
            onSnapshot(incomeDocRef, (snap) => {
                if (snap.exists()) {
                    currentIncome = snap.data().income || {};
                    updateUIInputs();
                }
                calculateTotals();
            }, (error) => {
                console.error("Income Listener Error:", error);
                document.getElementById('statusText').innerText = "Income Access Denied";
            });

            // Listen for Expenses
            onSnapshot(expensesColRef, (snap) => {
                expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderExpenseList();
                calculateTotals();
            }, (error) => {
                console.error("Expense Listener Error:", error);
                document.getElementById('statusText').innerText = "Expense Access Denied";
            });
        }

        function renderIncomeFields() {
            const container = document.getElementById('incomeFields');
            container.innerHTML = incomeCats.map(cat => `
                <div class="flex justify-between items-center py-2 border-b border-slate-50">
                    <label class="text-[11px] font-black text-slate-500 uppercase tracking-tighter">${cat}</label>
                    <div class="flex items-center gap-1">
                        <span class="text-slate-300 font-bold text-sm">$</span>
                        <input type="number" step="0.01" data-cat="${cat}" onchange="saveIncome('${cat}', this.value)" placeholder="0.00" 
                        class="income-input w-24 text-right font-black text-slate-800 outline-none bg-transparent">
                    </div>
                </div>
            `).join('');
        }

        function renderExpenseOptions() {
            const select = document.getElementById('expenseCategory');
            select.innerHTML = expenseCats.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        window.saveIncome = async (cat, val) => {
            if (!auth.currentUser) return;
            const num = parseFloat(val) || 0;
            currentIncome[cat] = num;
            
            const incomeDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'income_summaries', dateKey);
            try {
                await setDoc(incomeDocRef, { income: currentIncome }, { merge: true });
            } catch (e) {
                console.error("Save income failed", e);
            }
        };

        window.addExpense = async () => {
            if (!auth.currentUser) return;
            const cat = document.getElementById('expenseCategory').value;
            const amt = parseFloat(document.getElementById('expenseAmount').value) || 0;
            if (amt <= 0) return;

            const id = Date.now().toString();
            const expenseDocRef = doc(db, 'artifacts', appId, 'public', 'data', `expenses_log_${dateKey}`, id);
            
            try {
                await setDoc(expenseDocRef, {
                    category: cat,
                    amount: amt,
                    timestamp: new Date().toISOString()
                });
                document.getElementById('expenseAmount').value = '';
            } catch (e) {
                console.error("Add expense failed", e);
            }
        };

        window.removeExpense = async (id) => {
            if (!auth.currentUser) return;
            const expenseDocRef = doc(db, 'artifacts', appId, 'public', 'data', `expenses_log_${dateKey}`, id);
            try {
                await deleteDoc(expenseDocRef);
            } catch (e) {
                console.error("Delete expense failed", e);
            }
        };

        function updateUIInputs() {
            document.querySelectorAll('.income-input').forEach(input => {
                const cat = input.dataset.cat;
                if (document.activeElement !== input) {
                    input.value = currentIncome[cat] || '';
                }
            });
        }

        function renderExpenseList() {
            const list = document.getElementById('expenseList');
            if (expenses.length === 0) {
                list.innerHTML = '<p class="text-center py-10 text-[10px] font-bold text-slate-300 uppercase">No Records Found</p>';
                return;
            }
            list.innerHTML = expenses.map(exp => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <div>
                        <p class="text-[11px] font-black text-slate-700 uppercase leading-none">${exp.category}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-black text-rose-500 text-sm">-$${exp.amount.toFixed(2)}</span>
                        <button onclick="removeExpense('${exp.id}')" class="text-slate-300 hover:text-rose-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function calculateTotals() {
            const totalInc = Object.values(currentIncome).reduce((a, b) => a + b, 0);
            const totalExp = expenses.reduce((a, b) => a + b.amount, 0);
            const net = totalInc - totalExp;

            document.getElementById('totalIncomeDisplay').innerText = `$${totalInc.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('totalExpenseDisplay').innerText = `$${totalExp.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('netCashDisplay').innerText = `$${net.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            
            const statusDot = document.getElementById('statusDot');
            statusDot.classList.remove('bg-amber-500', 'animate-pulse');
            statusDot.classList.add('bg-emerald-500');
            document.getElementById('statusText').innerText = "Cloud Sync Online";
        }

        window.onload = initApp;
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-32">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight leading-none">Voices South</h1>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Portal Date: <span id="dateDisplay" class="text-indigo-600">...</span></p>
                </div>
            </div>
            <div class="flex items-center gap-2 px-3 py-1 bg-white border border-slate-100 rounded-full shadow-sm">
                <div id="statusDot" class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></div>
                <span id="statusText" class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Initializing...</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-8">
        
        <!-- Dashboard Summary -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Income</p>
                <p id="totalIncomeDisplay" class="text-3xl font-black text-emerald-600">$0.00</p>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Expenses</p>
                <p id="totalExpenseDisplay" class="text-3xl font-black text-slate-900">$0.00</p>
            </div>
            <div class="bg-indigo-600 p-6 rounded-3xl shadow-xl shadow-indigo-100 text-white">
                <p class="text-[10px] font-black text-indigo-200 uppercase tracking-widest mb-1">Weekly Surplus</p>
                <p id="netCashDisplay" class="text-3xl font-black">$0.00</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Income Section -->
            <section class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">Revenue Tracking</h2>
                    <span class="text-[9px] font-bold text-slate-300">Live Sync</span>
                </div>
                <div id="incomeFields" class="space-y-1">
                    <!-- Dynamic -->
                </div>
            </section>

            <!-- Expense Section -->
            <section class="space-y-6">
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-6">New Expense</h2>
                    <div class="space-y-3">
                        <select id="expenseCategory" class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 ring-indigo-500/20">
                            <!-- Dynamic -->
                        </select>
                        <div class="flex gap-2">
                            <input type="number" id="expenseAmount" placeholder="0.00" class="flex-1 bg-slate-50 border border-slate-100 p-3 rounded-xl text-sm font-bold outline-none">
                            <button onclick="addExpense()" class="bg-slate-900 text-white px-5 rounded-xl hover:bg-black transition-all active:scale-95">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Activity Log</h2>
                    <div id="expenseList" class="space-y-2 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                        <!-- Dynamic -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-lg no-print">
        <button onclick="window.print()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-full font-black text-xs uppercase tracking-widest shadow-2xl shadow-indigo-200 transition-all active:scale-95 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Print Summary Report
        </button>
    </footer>

</body>
</html>
